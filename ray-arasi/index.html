<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trafik Ustası</title>
<meta name="description" content="4 düz yolla başlayan maket şehrini büyüt: talepleri karşıla, yol, ray ve havalimanı kur, sıkışan trafiği köprü ve alt geçitle çöz.">
<meta name="theme-color" content="#1a242b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;700;800;900&family=Overpass+Mono:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage" data-mode="">
    <canvas id="gl" aria-label="Oyun sahnesi"></canvas>

    <!-- ANA EKRAN -->
    <section id="menu" class="screen" aria-label="Ana ekran">
      <header class="menu-head">
        <div class="title-plate"><h1 id="oyun-adi">TRAFİK USTASI</h1></div>
        <p class="tagline">Yolu parmağınla çiz, köprüyü ve alt geçidi istediğin yere koy.</p>
        <button id="btn-dil" class="btn-dil round-btn" type="button" aria-label="Dil: Türkçe. İngilizceye geç">TR</button>
        <button class="btn-sound round-btn" type="button" aria-label="Sesi kapat" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M16 9l6 6M22 9l-6 6"/></svg>
        </button>
      </header>
      <div class="menu-banner"><span class="card-view" data-scene="road"></span>
        <div id="menu-stars" class="menu-stars" aria-label="Toplam yıldız"></div>
        <div class="menu-banner-txt"><strong id="menu-set-t">Karayolu bölümleri</strong><em id="menu-set-d">Evleri iş yerlerine bağla, trafiği tıkatma</em></div>
      </div>
      <div class="lv-tabs" role="tablist" aria-label="Bölüm türü">
        <button type="button" role="tab" data-set="road" aria-selected="true">Karayolu</button>
        <button type="button" role="tab" data-set="rail" aria-selected="false">Demiryolu</button>
        <button type="button" role="tab" data-set="air" aria-selected="false">Havalimanı</button>
      </div>
      <div id="lv-grid" class="lv-grid" role="list" aria-label="Bölümler"></div>
      <footer class="menu-foot">
        <span class="free-lbl">Serbest atölye</span>
        <button class="free-btn" type="button" data-mode="road">Karayolu</button>
        <button class="free-btn" type="button" data-mode="rail">Demiryolu</button>
        <button class="free-btn" type="button" data-mode="air">Havalimanı</button>
      </footer>
    </section>


    <!-- ATÖLYE -->
    <section id="ws" class="screen" hidden aria-label="Atölye">
      <div class="ws-top">
        <button id="ws-back" class="round-btn" type="button" aria-label="Ana ekrana dön"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ln" d="M15 5l-7 7 7 7"/></svg></button>
        <div class="ws-head"><strong id="ws-title">Atölye</strong><small id="ws-stats"></small></div>
        <button id="ws-ai" class="ws-ai on" type="button" aria-pressed="true" title="Yapay zekâ ışıkları, makasları ve kuleyi yönetsin"><span class="dot"></span><span class="lbl">YZ</span></button>
        <button id="ws-play" class="round-btn" type="button" aria-label="Trafiği durdur"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="pz" x="6" y="5" width="4" height="14" rx="1.2"/><rect class="pz" x="14" y="5" width="4" height="14" rx="1.2"/><path class="pl" d="M8 5l11 7-11 7z"/></svg></button>
        <button id="ws-menu" class="round-btn" type="button" aria-label="Diğer seçenekler"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      </div>
      <div class="ws-city" id="ws-city">
        <button class="ws-mood" id="ws-mood" type="button" data-lv="ok" aria-label="Memnuniyet: neden bu kadar?">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1.8 2 5.2 2 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>
          <span class="meter"><i></i></span><b>%85</b>
        </button>
        <button class="ws-popn" id="ws-popn" type="button" aria-label="Şehrin aşaması ve nüfusu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V10l5-4 5 4v10"/><path d="M13 20v-7h8v7"/><path d="M2 20h20"/></svg><span class="lv"><b>Köy</b><span>300</span><span class="meter"><i></i></span></span></button>
        <button id="ws-dem" class="ws-dem" type="button" data-st="none" aria-label="Sıradaki talebe git"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><path d="M12 7v3.5M12 13h.01"/></svg><b>0</b><span>talep</span></button>
      </div>
      <div id="ws-pop" class="ws-pop" hidden>
        <button id="ws-new" type="button">Yeni şehir (4 düz yol)</button>
        <button id="ws-sample" type="button">Örnek düzeni yükle</button>
        <button id="ws-clear" type="button">Tahtayı temizle</button>
      </div>
      <div id="ws-toast" class="ws-toast" hidden role="status"></div>
      <div class="ws-zoom" role="group" aria-label="Görünüm">
        <button id="ws-zin" class="round-btn" type="button" aria-label="Yakınlaştır"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ln" d="M12 5v14M5 12h14"/></svg></button>
        <button id="ws-zout" class="round-btn" type="button" aria-label="Uzaklaştır"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ln" d="M5 12h14"/></svg></button>
        <button id="ws-zfit" class="round-btn" type="button" aria-label="Tüm tahtayı göster"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ln" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="ws-bar">
        <div class="ws-row ws-tools" role="toolbar" aria-label="Çizim aracı">
          <button type="button" data-tool="look" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>İzle</button>
          <button type="button" data-tool="road" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 3L4 21M16 3l4 18"/><path d="M12 4v3M12 10v4M12 17v3"/></svg>Yol</button>
          <button type="button" data-tool="rail" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 2v20M15 2v20"/><path d="M6 6h12M6 11h12M6 16h12"/></svg>Ray</button>
          <button type="button" data-tool="taxi" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3c.8 0 1.2.8 1.2 1.8V9l5.8 3.4v1.8l-5.8-1.7v3.8l1.8 1.4V19l-3-.8-3 .8v-1.3l1.8-1.4v-3.8L5 14.2v-1.8L10.8 9V4.8C10.8 3.8 11.2 3 12 3z"/></svg>Taksi yolu</button>
          <button type="button" data-tool="runway" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="1.5"/><path d="M12 5v3M12 11v3M12 17v2"/></svg>Pist</button>
          <button type="button" data-tool="lot" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M10 17V8h3a2.5 2.5 0 0 1 0 5h-3"/></svg>Otopark</button>
          <button type="button" data-tool="erase" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 16l9-9 7 7-6 6H8z"/><path d="M9 20h11"/></svg>Sil</button>
        </div>
        <div class="ws-row">
          <div id="ws-styles" class="ws-styles" role="toolbar" aria-label="Kesişim türü">
            <button type="button" data-style="grade" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg>Kavşak</button>
            <button type="button" data-style="bridge" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 8h20"/><path d="M5 21v-7a7 7 0 0 1 14 0v7"/><path d="M5 8v4M19 8v4"/></svg>Köprü</button>
            <button type="button" data-style="tunnel" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 9h20"/><path d="M6 21v-6a6 6 0 0 1 12 0v6"/><path d="M2 21h20"/></svg>Alt geçit</button>
          </div>
          <button id="ws-undo" class="ws-icon" type="button" aria-label="Geri al" disabled><svg viewBox="0 0 24 24"><path d="M9 7H4V2"/><path d="M4.5 7.5A8 8 0 1 1 6 18"/></svg></button>
          <div class="ws-dens" aria-label="Trafik yoğunluğu">
            <button id="ws-less" type="button" aria-label="Trafiği azalt">−</button>
            <span id="ws-dens"><i></i><i></i><i></i><i></i><i></i></span>
            <button id="ws-more" type="button" aria-label="Trafiği artır">+</button>
          </div>
        </div>
      </div>
    </section>


    <!-- BÖLÜM -->
    <section id="lv" class="screen" hidden aria-label="Bölüm">
      <div class="lv-top">
        <button id="lv-back" class="round-btn" type="button" aria-label="Bölümlere dön"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ln" d="M15 5l-7 7 7 7"/></svg></button>
        <div class="lv-head"><strong id="lv-title">Bölüm 1</strong><div class="lv-goal"><span class="meter"><i id="lv-goalbar"></i></span><b id="lv-goaltxt">0 / 8</b></div></div>
        <button id="lv-hint" class="round-btn" type="button" aria-label="İpucu"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ln" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
      </div>
      <div id="lv-toast" class="ws-toast lv-toast" hidden role="status"></div>
      <div class="lv-zoom" role="group" aria-label="Görünüm">
        <button id="lv-zin" class="round-btn" type="button" aria-label="Yakınlaştır"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ln" d="M12 5v14M5 12h14"/></svg></button>
        <button id="lv-zout" class="round-btn" type="button" aria-label="Uzaklaştır"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ln" d="M5 12h14"/></svg></button>
        <button id="lv-zfit" class="round-btn" type="button" aria-label="Tüm tahtayı göster"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ln" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="lv-bar">
        <div class="lv-row">
          <div class="lv-tools" role="toolbar" aria-label="Araç">
            <button type="button" data-lvtool="road" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 20c4-1 5-6 8-8s7-2 8-8"/><path d="M15 19l5-5" /></svg><span id="lv-drawlbl">Yol çiz</span></button>
            <button type="button" data-lvtool="erase" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 16l9-9 7 7-6 6H8z"/><path d="M9 20h11"/></svg>Sil</button>
          </div>
          <div class="lv-toks" role="toolbar" aria-label="Köprü ve alt geçit">
            <button type="button" id="lv-tok-b" class="lv-tok" data-lvtool="bridge" aria-pressed="false" aria-label="Köprü: yapılabilecek yerleri göster"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8h20"/><path d="M5 21v-7a7 7 0 0 1 14 0v7"/></svg>Köprü <b id="lv-nb">0</b></button>
            <button type="button" id="lv-tok-t" class="lv-tok" data-lvtool="tunnel" aria-pressed="false" aria-label="Alt geçit: yapılabilecek yerleri göster"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21h20"/><path d="M6 21v-6a6 6 0 0 1 12 0v6"/></svg><span id="lv-tunlbl">Alt geçit</span> <b id="lv-nt">0</b></button>
          </div>
          <button id="lv-undo" class="ws-icon" type="button" aria-label="Geri al" disabled><svg viewBox="0 0 24 24"><path d="M9 7H4V2"/><path d="M4.5 7.5A8 8 0 1 1 6 18"/></svg></button>
        </div>
        <div class="lv-row">
          <div class="lv-budget"><span id="lv-matlbl">Asfalt</span><span class="meter"><i id="lv-budgetbar"></i></span><b id="lv-budgettxt">0 / 40 m</b></div>
          <button id="lv-speed" class="lv-speed" type="button" hidden>1×</button>
          <button id="lv-play" class="lv-play" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pl" d="M8 5l11 7-11 7z"/><rect class="pz" x="6" y="5" width="4" height="14" rx="1"/><rect class="pz" x="14" y="5" width="4" height="14" rx="1"/></svg><span>Başlat</span></button>
        </div>
      </div>
      <div id="lv-pick" class="lv-pick" hidden role="dialog" aria-label="Kesişim türü">
        <p>Bu kesişim ne olsun?</p>
        <div class="lv-pick-row">
          <button type="button" data-pick="junction"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg><span>Kavşak</span><b></b></button>
          <button type="button" data-pick="bridge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8h20"/><path d="M5 21v-7a7 7 0 0 1 14 0v7"/></svg><span>Köprü</span><b></b></button>
          <button type="button" data-pick="tunnel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21h20"/><path d="M6 21v-6a6 6 0 0 1 12 0v6"/></svg><span>Alt geçit</span><b></b></button>
        </div>
      </div>
      <div id="lv-card" class="lv-card" hidden></div>
    </section>

    <div id="rotate" class="screen overlay" aria-live="polite"><div class="res-card"><p class="res-kicker">Dikey ekran</p><p class="res-sentence">Oyun telefon dik tutularak oynanır. Telefonunu çevir.</p></div></div>
    <div id="fatal" class="screen overlay" hidden><div class="res-card"><p class="res-kicker">WebGL gerekli</p><p class="res-sentence"></p></div></div>
  </div>
</div>
<script src="js/vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/dil.js"></script>
<script src="js/en-arayuz.js"></script>
<script src="js/en-bolum.js"></script>
<script src="js/en-atolye.js"></script>
<script src="js/en-bolumler.js"></script>
<script src="js/models.js"></script>
<script src="js/ws-grid.js"></script>
<script src="js/ws-net.js"></script>
<script src="js/ws-build.js"></script>
<script src="js/ws-sim.js"></script>
<script src="js/ws-city.js"></script>
<script src="js/lv-data.js"></script>
<script src="js/lv-net.js"></script>
<script src="js/lv-sim.js"></script>
<script src="js/lv-view.js"></script>
<script src="js/lv-game.js"></script>
<script src="js/workshop.js"></script>
<script src="js/menu.js"></script>
<script src="js/app.js"></script>
</body>
</html>
