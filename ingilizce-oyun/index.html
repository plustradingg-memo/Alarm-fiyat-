<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#AEE2FF">
</head>
<body>
<title>Bubu ile İngilizce</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: oyuncak kutusu — kalın çizgili, sert gölgeli "oyuncak blok" kartlar; gökyüzü + tepeler sahnesi; her ekranda tek iş */
:root{
  --sky:#AEE2FF; --sky-deep:#79C8F2; --cloud:#FFFFFF; --twinkle:transparent;
  --hill-1:#86D873; --hill-2:#62C25C;
  --paper:#FFFFFF; --paper-2:#EAF4FF; --empty:#DCE6F2;
  --line:#1E2A4A; --text:#1E2A4A; --text-soft:#4D5C82; --on-candy:#1E2A4A;
  --sun:#FFC52E; --hl:#FFE27A; --good-soft:#C9F3D9; --focus:#1E2A4A;
  --go:#3CC46E; --wood:#E9BC80; --wood-2:#C98F4E;
  --orb:#FFC52E; --orb-shade:transparent; --sil-hint:brightness(0) opacity(.5);
  --scrim:rgba(22,34,70,.55);
  --sil:brightness(0) opacity(.14);
  --c-red:#FF8A7A; --c-orange:#FFB347; --c-yellow:#FFD84D; --c-lime:#CBE96A; --c-green:#8BDB76;
  --c-teal:#6ED9C6; --c-blue:#8DC4FF; --c-violet:#BCA4FF; --c-pink:#FFA3CF; --c-sand:#F5CF94;
  --font-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r-lg:26px; --r-md:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#14204A; --sky-deep:#0C1636; --cloud:#1E2C5E; --twinkle:#FFF3B8;
    --hill-1:#1C4A3A; --hill-2:#15392D;
    --paper:#24366A; --paper-2:#1B2A58; --empty:#31447A;
    --line:#060A1A; --text:#F3F6FF; --text-soft:#B7C3EA; --on-candy:#1E2A4A;
    --sun:#FFCB3D; --hl:rgba(255,203,61,.38); --good-soft:#1E5C46; --focus:#FFCB3D;
  --go:#46D07C; --wood:#8C6236; --wood-2:#6B4723;
  --orb:#F3EDC4; --orb-shade:#D3CA94; --sil-hint:brightness(0) invert(1) opacity(.55);
    --scrim:rgba(0,0,0,.62);
    --sil:brightness(0) invert(1) opacity(.16);
    --c-red:#F58676; --c-orange:#F7AA42; --c-yellow:#F7D24A; --c-lime:#C2E063; --c-green:#80D06D;
    --c-teal:#62CDBB; --c-blue:#82B9F5; --c-violet:#AF98F5; --c-pink:#F598C4; --c-sand:#EAC487;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#14204A; --sky-deep:#0C1636; --cloud:#1E2C5E; --twinkle:#FFF3B8;
  --hill-1:#1C4A3A; --hill-2:#15392D;
  --paper:#24366A; --paper-2:#1B2A58; --empty:#31447A;
  --line:#060A1A; --text:#F3F6FF; --text-soft:#B7C3EA; --on-candy:#1E2A4A;
  --sun:#FFCB3D; --hl:rgba(255,203,61,.38); --good-soft:#1E5C46; --focus:#FFCB3D;
  --go:#46D07C; --wood:#8C6236; --wood-2:#6B4723;
  --orb:#F3EDC4; --orb-shade:#D3CA94; --sil-hint:brightness(0) invert(1) opacity(.55);
  --scrim:rgba(0,0,0,.62);
  --sil:brightness(0) invert(1) opacity(.16);
  --c-red:#F58676; --c-orange:#F7AA42; --c-yellow:#F7D24A; --c-lime:#C2E063; --c-green:#80D06D;
  --c-teal:#62CDBB; --c-blue:#82B9F5; --c-violet:#AF98F5; --c-pink:#F598C4; --c-sand:#EAC487;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sky);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sky)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:3px dashed var(--focus);outline-offset:3px}
h1,h2,h3{font-family:var(--font-display);line-height:1.05;margin:0;text-wrap:balance}
.emo{display:inline-block;line-height:1;font-family:var(--font-emoji)}

/* ---------- sahne ---------- */
.scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.scene::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 8% 12%,var(--twinkle) 0 1.6px,transparent 2.4px),
  radial-gradient(circle at 23% 30%,var(--twinkle) 0 1.2px,transparent 2px),
  radial-gradient(circle at 41% 9%,var(--twinkle) 0 2px,transparent 2.8px),
  radial-gradient(circle at 62% 22%,var(--twinkle) 0 1.3px,transparent 2px),
  radial-gradient(circle at 78% 8%,var(--twinkle) 0 1.8px,transparent 2.6px),
  radial-gradient(circle at 92% 28%,var(--twinkle) 0 1.4px,transparent 2.2px),
  radial-gradient(circle at 54% 44%,var(--twinkle) 0 1.2px,transparent 2px),
  radial-gradient(circle at 14% 58%,var(--twinkle) 0 1.5px,transparent 2.3px),
  radial-gradient(circle at 86% 52%,var(--twinkle) 0 1.6px,transparent 2.4px)}
.cloud{position:absolute;width:96px;height:30px;border-radius:30px;background:var(--cloud);opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:46px;height:46px;left:14px;top:-24px}
.cloud::after{width:36px;height:36px;left:48px;top:-15px}
.cloud.k1{top:16%;animation-duration:80s;animation-delay:-20s}
.cloud.k2{top:38%;animation-duration:110s;animation-delay:-70s;transform:scale(.7)}
.cloud.k3{top:64%;animation-duration:95s;animation-delay:-45s}
.hill{position:absolute;border-radius:50%}
.hill.h1{left:-12%;bottom:-70px;width:72%;height:170px;background:var(--hill-1)}
.hill.h2{right:-18%;bottom:-110px;width:78%;height:210px;background:var(--hill-2)}

/* ---------- üst çubuk ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sky)}
.topbar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;min-width:0}
.logo .owl{width:40px;height:42px;flex:none}
.logo-text{font-family:var(--font-display);font-weight:800;font-size:25px;line-height:.85;display:flex;flex-direction:column;text-align:left}
.logo-text small{font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--text-soft);line-height:1.3}
.stats{display:flex;align-items:center;gap:6px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 11px 0 7px;background:var(--paper);border:3px solid var(--line);border-radius:999px;box-shadow:0 3px 0 var(--line);font-family:var(--font-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;color:var(--text)}
.pill svg{width:24px;height:24px;flex:none}
.pill.bump{animation:bump .4s}
.chest-pill{width:40px;padding:0;justify-content:center;background:conic-gradient(var(--sun) calc(var(--p,0) * 1%),var(--paper) 0)}
.chest-pill .ring-in{width:27px;height:27px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.chest-pill .chest{width:22px;height:20px}
.chest-pill.ready{animation:jiggle 1.4s infinite}
.gear{position:relative;width:40px;height:40px;flex:none;border-radius:50%;border:3px solid var(--line);background:var(--paper);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;padding:0;color:var(--text-soft);overflow:hidden}
.gear::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--sun);transform:scale(0);transition:transform .15s}
.gear.holding::before{transform:scale(1);transition:transform 1.1s linear}
.gear svg{position:relative;width:21px;height:21px}
.gear-hole{fill:var(--paper)}

/* ---------- genel ---------- */
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 120px;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 20px;background:var(--paper);color:var(--text);border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.1;transition:transform .08s,box-shadow .08s}
.btn.small{min-height:42px;font-size:16px;padding:6px 14px}
.btn.primary{background:var(--sun);color:var(--on-candy)}
.btn.danger{background:var(--paper-2);color:var(--text)}
.btn.armed{background:var(--c-red);color:var(--on-candy)}
.btn svg{width:20px;height:20px;flex:none}
.btn:active,.cat-tile:active,.word-card:active,.choice:active,.game-btn:active,.back:active,.say-btn:active,.pill:active,.album-banner:active,.wod:active,.sticker:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.star-ico .st{fill:var(--sun);stroke:var(--line);stroke-width:7;stroke-linejoin:round}
.star-ico.off .st{fill:var(--empty)}
.stk{fill:var(--c-pink);stroke:var(--line);stroke-width:2;stroke-linejoin:round}
.stk-fold{fill:var(--paper);stroke:var(--line);stroke-width:2;stroke-linejoin:round}

/* ---------- resimler ---------- */
.blob{display:inline-block;width:1em;height:1em;background:var(--blob);border:.055em solid var(--line);border-radius:58% 42% 55% 45% / 48% 58% 42% 52%;box-shadow:inset -.07em -.09em 0 rgba(0,0,0,.14),inset .07em .07em 0 rgba(255,255,255,.4)}
.shape{display:block;width:1em;height:1em;overflow:visible}
.numpic{display:flex;flex-direction:column;align-items:center;gap:.05em}
.digit{font-family:var(--font-display);font-weight:800;line-height:.85;color:var(--d);-webkit-text-stroke:.035em var(--line);paint-order:stroke fill}
.numpic .digit{font-size:.78em}
.ndots{display:grid;grid-template-columns:repeat(5,.15em);gap:.05em;justify-content:center}
.ndots i{width:.15em;height:.15em;border-radius:50%;background:var(--d);border:.025em solid var(--line)}

/* ---------- maskot ---------- */
.owl{overflow:visible}
.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5s infinite}
.owl.cheer{animation:hop .75s cubic-bezier(.3,1.4,.5,1)}
.owl .wing{transform-box:fill-box}
.owl .wing-l{transform-origin:90% 10%}
.owl .wing-r{transform-origin:10% 10%}
.owl.cheer .wing-l{animation:flap-l .25s 3}
.owl.cheer .wing-r{animation:flap-r .25s 3}

/* ---------- ana sayfa ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;gap:6px 16px;margin-block:10px 26px}
.owl-btn{background:none;border:0;padding:0;width:clamp(92px,25vw,150px)}
.owl-btn .owl{width:100%;height:auto;display:block}
.bubble{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--line);padding:14px 16px 16px;display:grid;gap:12px;margin-bottom:22px;min-width:0}
.bubble::before,.prompt-bubble::before{content:"";position:absolute;left:-13px;bottom:24px;width:22px;height:22px;background:var(--paper);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg) skew(10deg,10deg)}
.bubble-text{margin:0;font-weight:800;font-size:clamp(16px,4.2vw,20px);line-height:1.3}
.wod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 12px;text-align:left;background:var(--cat);color:var(--on-candy);border:3px solid var(--line);border-radius:var(--r-md);box-shadow:0 4px 0 var(--line);padding:9px 12px 11px;transition:transform .08s,box-shadow .08s}
.wod-tag{grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.wod-pic{font-size:46px;line-height:1;display:grid;place-items:center}
.wod-words{min-width:0}
.wod-words b{display:block;font-family:var(--font-display);font-size:30px;line-height:1}
.wod-words small{font-weight:800;font-size:14px}
.wod-say{width:46px;height:46px;border-radius:50%;background:var(--paper);color:var(--text);border:3px solid var(--line);display:grid;place-items:center}
.wod-say svg{width:24px;height:24px}

.section-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-block:4px 14px}
.section-head h2{font-size:30px}
.section-head .en{font-family:var(--font-display);font-weight:700;color:var(--text-soft);font-size:18px}
.section-head .learned{margin-left:auto;font-weight:800;font-size:14px;color:var(--text-soft);font-variant-numeric:tabular-nums}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px 14px}
.cat-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--cat);color:var(--on-candy);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);padding:12px 14px 13px;transition:transform .08s,box-shadow .08s;min-width:0}
.cat-icon{font-size:48px;line-height:1.1;transition:transform .2s}
.cat-tile:hover .cat-icon{transform:rotate(-8deg) scale(1.08)}
.cat-name{font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.05;margin-top:4px}
.cat-en{font-weight:800;font-size:13px;opacity:.78;letter-spacing:.02em}
.cat-foot{display:flex;align-items:center;gap:8px;margin-top:10px;width:100%}
.bar{flex:1;height:11px;border-radius:99px;background:rgba(255,255,255,.6);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--line);border-radius:99px}
.medals{display:flex;gap:1px}
.medals svg{width:15px;height:15px}
.medals .star-ico.off .st{fill:rgba(255,255,255,.6)}
.crown{position:absolute;top:-18px;right:8px;font-size:32px;transform:rotate(14deg);filter:drop-shadow(0 2px 0 var(--line))}

.album-banner{margin-top:26px;width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);padding:14px 16px;transition:transform .08s,box-shadow .08s}
.fan{display:flex;flex:none;padding-left:18px}
.fan span{width:50px;height:58px;border:3px solid var(--line);border-radius:12px;background:var(--paper-2);display:grid;place-items:center;font-size:28px;margin-left:-18px;transform:rotate(var(--r));box-shadow:0 3px 0 var(--line)}
.ab-text{min-width:0;display:grid;gap:2px}
.ab-text b{font-family:var(--font-display);font-size:22px;line-height:1.1}
.ab-text small{font-weight:700;color:var(--text-soft);font-size:14px}

/* ---------- sayfa başlığı ---------- */
.page-head{display:flex;align-items:center;gap:10px;margin-block:6px 18px}
.back{width:50px;height:50px;flex:none;border-radius:16px;background:var(--paper);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:0;color:var(--text);transition:transform .08s,box-shadow .08s}
.back svg{width:26px;height:26px}
.ph-icon{width:54px;height:54px;flex:none;display:grid;place-items:center;font-size:32px;background:var(--cat);border:3px solid var(--line);border-radius:16px;transform:rotate(-5deg)}
.ph-title{min-width:0;flex:1}
.ph-title h1{font-size:clamp(23px,6.4vw,34px)}
.ph-title span{display:block;font-family:var(--font-display);font-weight:700;color:var(--text-soft);font-size:16px;line-height:1.2}
.ph-icon svg{width:100%;height:100%}
.ph-count{flex:none;font-family:var(--font-display);font-weight:800;font-size:18px;background:var(--paper);border:3px solid var(--line);border-radius:99px;padding:3px 12px;font-variant-numeric:tabular-nums}

/* ---------- bölüm: oyunlar + kelimeler ---------- */
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.game-btn{position:relative;display:flex;flex-direction:column;align-items:center;padding:10px 6px 10px;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);box-shadow:0 5px 0 var(--line);text-align:center;transition:transform .08s,box-shadow .08s;min-width:0}
.game-ico{font-size:36px;line-height:1.15}
.game-name{font-family:var(--font-display);font-weight:800;font-size:16px;line-height:1.05}
.game-en{font-size:12px;font-weight:800;color:var(--text-soft)}
.game-btn .rate{display:flex;gap:1px;margin-top:5px}
.game-btn .rate svg{width:15px;height:15px}
.game-btn.locked{background:var(--paper-2)}
.game-btn.locked .game-ico{filter:grayscale(1);opacity:.45}
.lock{margin-top:5px;font-size:12px;font-weight:800;background:var(--sun);color:var(--on-candy);border:2px solid var(--line);border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
.games.fresh .game-btn{animation:pop-in .55s backwards}
.games.fresh .game-btn:nth-child(2){animation-delay:.12s}
.games.fresh .game-btn:nth-child(3){animation-delay:.24s}
.nope{animation:shake .45s}

.explore-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.explore-bar p{margin:0;font-weight:800;color:var(--text-soft)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:14px 12px}
.word-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:142px;padding:12px 4px 10px;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s;min-width:0}
.word-card.is-new{background:var(--paper-2)}
.word-card.is-new::after{content:"YENİ";position:absolute;top:-11px;right:-6px;background:var(--sun);color:var(--on-candy);font-weight:800;font-size:11px;letter-spacing:.06em;padding:1px 7px;border:2.5px solid var(--line);border-radius:99px;transform:rotate(9deg)}
.word-card .pic{font-size:clamp(48px,13vw,64px);line-height:1;display:grid;place-items:center;min-height:1.1em}
.word-card .label{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:2.5em;text-align:center;max-width:100%}
.word-card .label b{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1}
.word-card .label b.long{font-size:16px}
.word-card .label b.xlong{font-size:14px}
.word-card .label small{font-weight:700;font-size:13px;color:var(--text-soft);line-height:1.2}
.word-card .label .q{color:var(--text-soft);letter-spacing:.18em;font-size:22px}
.word-card.bounce .pic{animation:boing .55s}
.word-card.reveal .label{animation:pop-in .45s}
.word-card.glow{box-shadow:0 5px 0 var(--line),0 0 0 6px var(--sun)}

/* ---------- oyun ekranları ---------- */
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:118px;flex:none}
.dots i{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--line);background:var(--paper);transition:background .2s,transform .2s}
.dots i.on{background:var(--sun)}
.dots i.now{transform:scale(1.3)}
.prompt{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}
.mini-owl{width:clamp(62px,17vw,84px);flex:none}
.mini-owl .owl{width:100%;height:auto;display:block}
.prompt-bubble{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--line);padding:12px 12px 12px 18px;margin-bottom:14px}
.ask{font-family:var(--font-display);font-weight:700;font-size:clamp(21px,5.8vw,32px);line-height:1.1;min-width:0}
.ask b{font-weight:800;background:linear-gradient(transparent 62%,var(--hl) 62%);padding:0 .08em}
.say-btn{width:56px;height:56px;flex:none;border-radius:50%;background:var(--sun);color:var(--on-candy);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:0;transition:transform .08s,box-shadow .08s}
.say-btn svg{width:28px;height:28px}
.hint{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-weight:800;color:var(--text-soft);margin:0 auto 14px;max-width:640px}
.hint b{color:var(--text);font-variant-numeric:tabular-nums}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:560px;margin:0 auto}
.choice{position:relative;aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);font-size:clamp(64px,21vw,112px);padding:0;line-height:1;transition:transform .08s,box-shadow .08s,opacity .2s}
.choices.fresh .choice{animation:pop-in .45s backwards}
.choices.fresh .choice:nth-child(2){animation-delay:.07s}
.choices.fresh .choice:nth-child(3){animation-delay:.14s}
.choices.fresh .choice:nth-child(4){animation-delay:.21s}
.choices .choice.right{background:var(--good-soft);animation:boing .6s}
.choices .choice.wrong{animation:shake .45s;opacity:.5}
.choice .tag{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:17px;font-family:var(--font-display);font-weight:800;background:var(--paper-2);border:2.5px solid var(--line);border-radius:99px;padding:0 10px;white-space:nowrap;line-height:1.5}
.choice .ok{position:absolute;top:-12px;right:-10px;width:40px;height:40px;border-radius:50%;background:var(--sun);border:3px solid var(--line);display:grid;place-items:center;color:var(--on-candy);animation:pop-in .35s}
.choice .ok svg{width:22px;height:22px}

.memory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:500px;margin:0 auto;perspective:900px}
.mcard{aspect-ratio:1;max-width:100%;padding:0;border:0;background:none}
.mc-inner{position:relative;display:block;width:100%;height:100%;transition:transform .42s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.mcard.open .mc-inner,.mcard.done .mc-inner{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;inset:0;border:3px solid var(--line);border-radius:var(--r-md);box-shadow:0 5px 0 var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.mc-back{background:repeating-linear-gradient(45deg,transparent 0 11px,rgba(255,255,255,.28) 11px 22px),var(--cat)}
.mc-back::after{content:"?";font-family:var(--font-display);font-weight:800;font-size:44px;color:var(--on-candy)}
.mc-front{transform:rotateY(180deg);background:var(--paper);font-size:clamp(40px,11vw,54px);align-content:center;gap:4px;line-height:1}
.mc-front small{font-family:var(--font-display);font-weight:800;font-size:14px;line-height:1}
.mcard.done .mc-front{background:var(--good-soft)}

.sky-area{position:relative;height:clamp(380px,62vh,620px);height:clamp(380px,62dvh,620px);border:3px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(var(--sky-deep),var(--sky));box-shadow:0 6px 0 var(--line);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.sky-area::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--hill-1);border-top:3px solid var(--line);z-index:3}
.sky-hint{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--text-soft);z-index:1}
.balloon{position:absolute;left:0;top:0;z-index:2;aspect-ratio:5/6;border:3px solid var(--line);border-radius:50% 50% 48% 48% / 56% 56% 44% 44%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.6) 0 9%,transparent 10%),var(--b);padding:0;display:grid;place-items:center;will-change:transform;line-height:1}
.balloon::before{content:"";position:absolute;left:50%;top:calc(100% - 2px);width:14px;height:10px;margin-left:-7px;background:var(--b);border:3px solid var(--line);border-radius:3px 3px 6px 6px}
.balloon::after{content:"";position:absolute;left:50%;top:calc(100% + 7px);width:2.5px;height:48px;margin-left:-1px;background:var(--line);border-radius:2px}
.balloon .b-face{display:grid;place-items:center;pointer-events:none}
.balloon.gold .b-face svg{width:.95em;height:.95em}
.balloon.wobble{animation:wobble .5s}
.balloon.popped{animation:popped .2s forwards;pointer-events:none}

/* ---------- albüm ---------- */
.album-sec{margin-bottom:26px}
.album-sec h3{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;font-size:24px;margin-bottom:10px}
.album-sec h3 small{font-size:16px;color:var(--text-soft);font-weight:700}
.album-sec h3 em{margin-left:auto;font-style:normal;font-size:16px;font-family:var(--font-body);font-weight:800;color:var(--text-soft);font-variant-numeric:tabular-nums}
.album-sec.treasure{background:var(--paper);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);padding:14px 14px 16px}
.album-sec.treasure .sticker{background:var(--paper-2)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.sticker{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;background:var(--paper);border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s;min-width:0}
.sticker .pic{font-size:36px;line-height:1;display:grid;place-items:center;min-height:1.1em}
.sticker .st-label{font-family:var(--font-display);font-weight:800;font-size:14px;line-height:1.05;text-align:center;max-width:100%;overflow-wrap:anywhere}
.sticker.bounce .pic{animation:boing .55s}
.sticker.locked{background:var(--paper-2);box-shadow:0 4px 0 var(--line);border-style:dashed}
.sticker.locked .pic{filter:var(--sil)}
.sticker.locked .st-label{color:var(--text-soft)}

/* ---------- pencereler ---------- */
#modal-root{position:fixed;inset:0;z-index:60}
.modal-back{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:max(70px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
.modal{position:relative;margin-block:auto;flex:none;width:min(440px,100%);background:var(--paper);border:3px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--line);padding:22px 20px 20px;text-align:center;display:grid;gap:14px;animation:modal-in .4s cubic-bezier(.2,1.4,.4,1)}
.modal h2{font-size:32px}
.modal h2 span{display:block;font-size:18px;color:var(--text-soft);font-weight:700;margin-top:4px}
.modal > .owl{width:112px;height:auto;margin:-82px auto -4px}
.modal p{margin:0}
.rating{display:flex;justify-content:center;gap:8px}
.rating svg{width:60px;height:60px}
.rating .on{animation:star-in .55s cubic-bezier(.3,1.5,.5,1) backwards}
.earned{font-weight:800;font-size:18px}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chest-btn{position:relative;isolation:isolate;background:none;border:0;padding:0;width:190px;max-width:100%;margin:6px auto 0}
.chest-btn .chest{width:100%;height:auto;display:block}
.chest-btn:not(.opened) .chest{animation:jiggle 1.3s infinite}
.chest .lid{transform-box:fill-box;transform-origin:0 100%;transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.chest-btn.opened .lid{transform:translate(-6px,-26px) rotate(-22deg)}
.rays{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;z-index:-1;border-radius:50%;background:repeating-conic-gradient(var(--hl) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);opacity:0;transition:opacity .5s;animation:spin 14s linear infinite}
.chest-btn.opened .rays{opacity:1}
.sub{font-weight:800;color:var(--text-soft)}
.prize{display:grid;justify-items:center;gap:2px}
.prize .pic{font-size:88px;line-height:1.05;animation:prize-up .7s cubic-bezier(.2,1.5,.4,1)}
.prize b{font-family:var(--font-display);font-size:36px;line-height:1}
.prize small{font-weight:800;font-size:16px;color:var(--text-soft)}
.prize p{font-weight:700;margin-top:6px}
.settings-modal{text-align:left}
.settings-modal h2{text-align:center}
.set-list{display:grid;gap:10px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800}
.seg{display:inline-flex;border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper-2)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:800;font-size:15px;min-height:40px}
.seg button + button{border-left:3px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--on-candy)}
.voice-box{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--paper-2);border-radius:14px;padding:10px 12px}
.voice-box p{font-size:14px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.note{font-size:14px;color:var(--text-soft);font-weight:700}
.tally{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;font-weight:700;color:var(--text-soft)}
.tally b{color:var(--text);font-size:17px;font-variant-numeric:tabular-nums}

/* ---------- bildirimler ---------- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:70;transform:translate(-50%,-16px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);width:max-content;background:var(--sun);color:var(--on-candy);border:3px solid var(--line);border-radius:999px;box-shadow:0 4px 0 var(--line);padding:7px 18px;font-family:var(--font-display);font-weight:800;font-size:18px;text-align:center;transition:opacity .2s,transform .25s cubic-bezier(.3,1.5,.5,1)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.big{font-size:30px;padding:8px 24px;top:40%;border-radius:22px}
#toast.big.show{transform:translate(-50%,0) rotate(-4deg) scale(1.05)}
#caption{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:65;transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);width:max-content;display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--text);border:3px solid var(--line);border-radius:999px;box-shadow:0 4px 0 var(--line);padding:6px 16px 6px 10px;font-family:var(--font-display);font-weight:700;font-size:19px;transition:opacity .2s,transform .2s}
#caption svg{width:22px;height:22px;flex:none;color:var(--text-soft)}
#caption.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.fly-star{position:fixed;width:30px;height:30px;z-index:90;pointer-events:none}
.fly-star svg{width:100%;height:100%;display:block}

/* ---------- ana sayfa: hikâye ve oyun kartları ---------- */
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;margin-bottom:28px}
.feature{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;background:var(--cat);color:var(--on-candy);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);padding:12px 14px 12px 10px;min-height:104px;transition:transform .08s,box-shadow .08s}
.feature:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.f-art{position:relative;width:78px;height:72px;flex:none}
.f-main{position:absolute;left:4px;top:6px;font-size:54px}
.f-a,.f-b{position:absolute;font-size:30px}
.f-a{right:-2px;top:0;transform:rotate(12deg)}
.f-b{right:4px;bottom:-4px;transform:rotate(-8deg)}
.f-text{display:grid;gap:1px;min-width:0}
.f-tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.f-text b{font-family:var(--font-display);font-size:23px;line-height:1.05}
.f-text small{font-weight:800;font-size:14px;opacity:.8}
.f-play{width:58px;height:58px;border-radius:50%;background:var(--paper);color:var(--text);border:3px solid var(--line);display:grid;place-items:center}
.f-play svg{width:28px;height:28px;margin-left:3px}
.f-badge{position:absolute;top:-14px;left:-8px;width:40px;height:40px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;font-size:22px;line-height:1;transform:rotate(-10deg)}

/* ---------- hikâye ve market: odak modu (tam ekran, kaydırmasız) ---------- */
body.focus-mode{overflow:hidden}
body.focus-mode .topbar,body.focus-mode #caption{display:none}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.act{position:fixed;inset:0;z-index:20;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  --item:clamp(72px,min(26vw,16vh),116px); --item:clamp(72px,min(26vw,16svh),116px);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.act-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px}
.act-btn{position:relative;width:64px;height:64px;flex:none;border-radius:20px;border:3px solid var(--line);background:var(--paper);color:var(--text);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:0;transition:transform .08s,box-shadow .08s}
.act-btn svg{width:32px;height:32px}
.act-btn.replay{border-radius:50%;background:var(--sun);color:var(--on-candy)}
.act-btn.muted::after{content:"";position:absolute;width:46px;height:5px;border-radius:3px;background:var(--line);transform:rotate(-45deg)}
.act-btn:active,.next-btn:active,.big-act:active .big-round,.item:active,.blanket:active,.pick:active,.r-item:active,.teach-pic:active,.want-pic:active{box-shadow:0 1px 0 var(--line);transform:translateY(3px)}
.act-mid{flex:1;min-width:0;display:flex;justify-content:center;pointer-events:none}
.steps,.slots{display:flex;align-items:center;gap:6px}
.step{width:40px;height:40px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;font-size:24px;line-height:1;filter:grayscale(1);opacity:.55}
.step svg{width:24px;height:24px}
.step .blob{font-size:22px}
.step.done{filter:none;opacity:1;background:var(--good-soft)}
.step.now{filter:none;opacity:1;background:var(--paper);box-shadow:0 0 0 4px var(--sun)}
.slot{width:36px;height:36px;border-radius:12px;border:3px dashed var(--line);background:var(--paper-2);display:grid;place-items:center;font-size:21px;line-height:1}
.slot.full{border-style:solid;background:var(--paper);animation:pop-in .4s}
.slot.now{box-shadow:0 0 0 3px var(--sun)}
.act-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;outline:none}
.act-main{flex:1;min-height:0;display:grid;place-items:center}
.go-row,.basket-row{flex:none;display:flex;align-items:flex-end;justify-content:center;gap:16px;min-height:92px}
.end-row{min-height:116px}

/* Bubu'nun balonu: o an söylenen cümle (yetişkin için yazı; çocuk için ses + resim) */
.tell{flex:none;display:flex;align-items:flex-end;gap:10px}
.owl-say{position:relative;width:62px;flex:none;background:none;border:0;padding:0}
.owl-say .owl{width:100%;height:auto;display:block}
.tell.talking .owl-say .owl{animation:bob .7s ease-in-out infinite}
.tell.talking .owl-say::after{content:"";position:absolute;right:-10px;top:14px;width:14px;height:22px;border:3px solid var(--line);border-left-color:transparent;border-radius:50%;opacity:.8}
.tell-bubble{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-start;gap:10px;margin-bottom:8px;padding:6px 8px 6px 16px;height:76px}
.tell-bubble p{flex:1;min-width:0;margin:0;font-weight:800;font-size:16px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tell-bubble b{font-family:var(--font-display);font-size:1.5em;line-height:1.05;background:linear-gradient(transparent 62%,var(--hl) 62%);padding:0 .06em}
.want-pic{flex:none;width:60px;height:60px;border-radius:18px;border:3px solid var(--line);background:var(--paper-2);color:var(--text);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;font-size:40px;line-height:1;padding:0}
.want-pic svg{width:30px;height:30px}
.want-pic.lvl1 > *{filter:var(--sil-hint)}
.want-pic.reveal-pic{animation:pop-in .45s}
.next-btn{display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:var(--go);color:var(--on-candy);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);padding:0;animation:breathe 1.8s ease-in-out infinite}
.next-btn svg{width:44px;height:44px;margin-left:6px}

/* sahne */
.stage{position:relative;width:100%;min-height:min(210px,30vh);min-height:min(210px,30svh);border:3px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(var(--sky-deep) 0,var(--sky) 64%,var(--hill-1) 64%);box-shadow:0 6px 0 var(--line);display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:12px}
.scene-sun{position:absolute;top:14px;right:18px;width:50px;height:50px;border-radius:50%;background:var(--orb);border:3px solid var(--line);box-shadow:inset -13px -5px 0 0 var(--orb-shade),0 0 0 9px var(--hl)}
.stage .cloud.c-a{top:34px;left:-20px;transform:scale(.7);animation:none;opacity:.9}
.scene-basket{position:relative;z-index:1;width:clamp(96px,30vw,140px)}
.scene-basket .basket-svg{width:100%;height:auto;display:block}
.scene-tree{position:relative;z-index:1;font-size:clamp(64px,19vw,96px);line-height:1}
.scene-flower{position:relative;z-index:1;font-size:40px;line-height:1;margin-bottom:4px}

/* öğretme kartı */
.teach{position:relative;display:grid;justify-items:center;gap:2px;background:var(--paper);border:3px solid var(--line);border-radius:28px;box-shadow:0 6px 0 var(--line);padding:10px 22px 14px;text-align:center}
.teach-pic{font-size:min(30vw,18vh,150px);font-size:min(30vw,18svh,150px);line-height:1.05;background:none;border:0;padding:6px;border-radius:24px;display:grid;place-items:center}
.teach-pic.bounce > *{animation:boing .55s}
.teach-word{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,min(11vw,7svh),54px);line-height:1}
.teach-tr{font-weight:800;color:var(--text-soft);font-size:17px}
.teach-extra .emo{position:absolute;font-size:40px;line-height:1}
.teach-extra .emo:first-child{left:-16px;top:22%;transform:rotate(-12deg)}
.teach-extra .emo:last-child{right:-14px;top:12%;transform:rotate(10deg)}

/* yerleştirilebilir nesneler + sepet */
.field{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.item{position:relative;width:var(--item);height:var(--item);flex:none;border-radius:24px;border:3px solid var(--line);background:var(--paper);box-shadow:0 5px 0 var(--line);font-size:calc(var(--item) * .58);line-height:1;display:grid;place-items:center;padding:0;touch-action:none;-webkit-touch-callout:none;transition:transform .15s,box-shadow .15s,opacity .2s}
.item.selected{transform:translateY(-8px) scale(1.06);box-shadow:0 0 0 4px var(--paper),0 0 0 10px var(--sun),0 0 0 13px var(--line);z-index:2}
.item.selected::after{content:"✋";position:absolute;top:-18px;right:-14px;font-size:24px;line-height:1;font-family:var(--font-emoji)}
.item.dragging{opacity:.25}
.item.gone,.item.waiting{visibility:hidden}
.item.soft{animation:boing .5s}
.item.arrive{animation:pop-in .45s}
.demo-item{width:calc(var(--item) * .8);height:calc(var(--item) * .8);font-size:calc(var(--item) * .48);align-self:center}
.drag-ghost{position:fixed!important;left:0;top:0;margin:0!important;z-index:95;pointer-events:none;opacity:.95;transition:none;box-shadow:0 14px 0 rgba(0,0,0,.18)}
.basket-drop{position:relative;display:block;flex:none;width:clamp(128px,min(44vw,30vh),210px);width:clamp(128px,min(44vw,30svh),210px);padding:26px 6px 2px;background:none;border:0;border-radius:26px;transition:transform .15s}
.basket-drop .basket-svg{width:100%;height:auto;display:block;position:relative;z-index:1}
.basket-drop.awaiting,.basket-drop.hover{outline:4px dashed var(--sun);outline-offset:2px}
.basket-drop.awaiting{animation:breathe 1.1s ease-in-out infinite}
.basket-drop.hover{transform:scale(1.08)}

/* ================= ses: konuşma ================= */
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let voices = [];
let speakId = 0;
function loadVoices(){ try { voices = synth ? (synth.getVoices() || []) : []; } catch (e) { voices = []; } }
if (synth){ loadVoices(); try { synth.onvoiceschanged = loadVoices; } catch (e) {} }
const vlang = v => (v.lang || '').replace('_', '-').toLowerCase();
// iOS'taki eğlence sesleri (Bubbles, Zarvox...) çocuk yönergeleri için uygun değil.
const NOVELTY = /^(Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox)\b/;
// Yalnızca CİHAZ ÜSTÜNDEKİ Türkçe sesler kullanılır: bulut sesleri (localService:false) metni dışarı gönderir.
function trVoice(){
  if (!voices.length) loadVoices();
  const tr = voices.filter(v => vlang(v).startsWith('tr') && v.localService !== false && !NOVELTY.test(v.name));
  for (const p of ['Yelda', 'Tolga', 'Emel', 'Filiz', 'Google']){ const v = tr.find(x => x.name.indexOf(p) > -1); if (v) return v; }
  return tr[0] || null;
}
let trBroken = false;
// 'ok' | 'unknown' (ses listesi boş, cihaz seçer) | 'none' | 'off' | 'nosynth'
function trState(){
  if (!synth) return 'nosynth';
  if (!S.settings.trVoice) return 'off';
  if (!voices.length) loadVoices();
  if (trBroken) return 'none';
  if (!voices.length) return 'unknown';
  return trVoice() ? 'ok' : 'none';
}
const canSpeakTr = () => { const s = trState(); return s === 'ok' || s === 'unknown'; };
function pickVoice(){
  if (!voices.length) loadVoices();
  const want = uk() ? 'en-gb' : 'en-us';
  const en = voices.filter(v => vlang(v).startsWith('en') && !NOVELTY.test(v.name));
  // Önce cihaz üstündeki sesler; yalnızca hiç yoksa uzak sese düşülür.
  const local = en.filter(v => v.localService !== false);
  const base = local.length ? local : en;
  const exact = base.filter(v => vlang(v) === want);
  const pool = exact.length ? exact : base;
  const prefer = ['Samantha','Google US English','Google UK English Female','Microsoft Aria','Microsoft Jenny','Microsoft Libby','Microsoft Sonia','Karen','Serena','Moira','Daniel','Microsoft Zira'];
  for (const p of prefer){ const v = pool.find(x => x.name.indexOf(p) > -1); if (v) return v; }
  return pool.find(v => v.localService) || pool[0] || null;
}
function speak(text){
  const id = ++speakId;
  caption(text);
  if (!synth) return wait(700 + text.length * 60).then(() => id);
  return new Promise(res => {
    let done = false;
    const fin = () => { if (!done){ done = true; res(id); } };
    try {
      synth.cancel();
      if (synth.paused) synth.resume();
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v){ u.voice = v; u.lang = v.lang; } else u.lang = uk() ? 'en-GB' : 'en-US';
      u.rate = S.settings.slow ? 0.6 : 0.85;
      u.pitch = 1.12;
      u.onend = fin; u.onerror = fin;
      synth.speak(u);
      setTimeout(fin, 1200 + text.length * (S.settings.slow ? 160 : 110));
    } catch (e) { fin(); }
  });
}
function utter(text, lang){
  const tr = lang === 'tr';
  const u = new SpeechSynthesisUtterance(text);
  const v = tr ? trVoice() : pickVoice();
  if (v){ u.voice = v; u.lang = v.lang; } else u.lang = tr ? 'tr-TR' : (uk() ? 'en-GB' : 'en-US');
  u.rate = tr ? (S.settings.slow ? 0.8 : 0.95) : (S.settings.slow ? 0.6 : 0.85);
  u.pitch = tr ? 1.05 : 1.12;
  if (tr) u.addEventListener('error', e => { if (/unavailable|synthesis-failed|language/.test((e && e.error) || '')) trBroken = true; });
  u.addEventListener('end', segBoundary); u.addEventListener('error', segBoundary);
  return u;
}
// Bir söz parçası bittiğinde bekleyenlere haber verir (ipucu sözü kelimenin ortasında kesmesin diye).
let segWaiters = [];
function segBoundary(){ const w = segWaiters; segWaiters = []; w.forEach(f => f()); }
const lineText = segs => segs.filter(s => s && s[1] && s[0] !== 'pause').map(s => s[1]).join(' ');
// İki dilli satır: [['tr','Elmayı sepete koy.'], ['en','Apple!'], ['pause', 1500], ['en','Apple!']].
// Parçalar arada iptal edilmeden sıraya alınır (Android'de Türkçe motor geç açılsa da kesilmez).
// Türkçe ses yoksa Türkçe parçalar okunmaz (İngilizce sesle bozuk okunmasın), yazısı balonda/altyazıda görünür.
// Söz bitince true, başka bir konuşma araya girerse false döner.
function speakLine(segs){
  const id = ++speakId;
  const text = lineText(segs);
  caption(text, segs.some(s => s && s[0] === 'tr') ? 'tr' : 'en');
  announce(text);
  const spoken = segs.filter(s => s && s[1] && (s[0] !== 'tr' || canSpeakTr()));
  const groups = [[]], pauses = [];
  spoken.forEach(s => { if (s[0] === 'pause'){ groups.push([]); pauses.push(s[1]); } else groups[groups.length - 1].push(s); });
  return (async () => {
    if (!synth || document.hidden){ await wait(synth ? 50 : 500); return id === speakId; }
    try {
      const busy = synth.speaking || synth.pending;
      synth.cancel();
      if (synth.paused) synth.resume();
      if (busy) await wait(80);
    } catch (e) {}
    for (let g = 0; g < groups.length; g++){
      if (id !== speakId) return false;
      if (g > 0){ await wait(pauses[g - 1]); if (id !== speakId) return false; }
      if (groups[g].length && !(await queueGroup(groups[g], id))) return false;
    }
    return id === speakId;
  })();
}
function queueGroup(parts, id){
  return new Promise(res => {
    let done = false;
    const fin = () => { if (!done){ done = true; res(id === speakId); } };
    try {
      parts.forEach(([lang, text], k) => {
        const u = utter(text, lang);
        if (k === parts.length - 1){ u.addEventListener('end', fin); u.addEventListener('error', fin); }
        synth.speak(u);
      });
      const chars = parts.reduce((n, p) => n + p[1].length, 0);
      setTimeout(fin, 3000 + chars * (S.settings.slow ? 160 : 110) + parts.length * 500);
    } catch (e) { fin(); }
  });
}
async function speakSeq(list, gap){
  for (const t of list){
    const id = await speak(t);
    if (id !== speakId) return;
    await wait(gap || 220);
    if (id !== speakId) return;
  }
}
function stopSpeech(){ speakId++; try { synth && synth.cancel(); } catch (e) {} }
let speechPrimed = false;
// iOS: ilk konuşma bir dokunuşun içinde başlamalı; ilk dokunuşta sessiz bir söz söylenir.
['pointerdown', 'pointerup', 'click'].forEach(ev => document.addEventListener(ev, () => {

let AC = null;
function ac(){
  if (!S.settings.sfx) return null;
  try {
    if (!AC){ const K = window.AudioContext || window.webkitAudioContext; if (!K) return null; AC = new K(); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }
  return AC;
}
function tone(f, t0, dur, o){
  const a = ac(); if (!a) return;
  o = o || {};
  const t = a.currentTime + t0, osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.vol || 0.16, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(a.destination);
  osc.start(t); osc.stop(t + dur + 0.03);
}
function noise(t0, dur, vol){
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = 900; g.gain.value = vol || 0.25;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(a.currentTime + t0);
}
const sfx = {
  tap(){ tone(880, 0, .07, { type:'triangle', vol:.12 }); },
  flip(){ tone(520, 0, .09, { type:'triangle', vol:.12, to:880 }); },
  good(){ tone(784, 0, .13, { vol:.16 }); tone(1175, .1, .24, { vol:.16 }); },
  bad(){ tone(330, 0, .3, { type:'triangle', vol:.13, to:170 }); },
  hmm(){ tone(440, 0, .1, { type:'triangle', vol:.07 }); tone(554, .1, .14, { type:'triangle', vol:.07 }); },
  pop(){ noise(0, .12, .3); tone(900, 0, .1, { type:'square', vol:.05, to:200 }); },
  star(){ tone(1568, 0, .09, { vol:.09 }); tone(2093, .07, .15, { vol:.09 }); },
  unlock(){ [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .08, .18, { type:'triangle', vol:.14 })); },
  win(){ [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, i * .11, .24, { type:'triangle', vol:.14 })); },
  chest(){ tone(180, 0, .25, { type:'sawtooth', vol:.05, to:320 }); [1046, 1318, 1568, 2093, 2637].forEach((f, i) => tone(f, .22 + i * .07, .2, { vol:.1 })); }
};

const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], craf = 0, dpr = 1;
function sizeCv(){ dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
addEventListener('resize', sizeCv); sizeCv();
function palette(){
  const cs = getComputedStyle(document.documentElement);
  return ['--c-red','--c-yellow','--c-blue','--c-green','--c-pink','--c-violet','--c-orange','--sun'].map(v => cs.getPropertyValue(v).trim() || '#FFC52E');
}
function burst(x, y, n, spread){
  if (reduced) n = Math.min(n, 6);
  const cols = palette(); spread = spread || 1;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 7) * spread;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pickOne(cols), life: 55 + rand(50), round: Math.random() < .3 });
  }
  if (!craf) craf = requestAnimationFrame(stepC);
}
function stepC(){
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of parts){
    p.vy += .25; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life / 25));
    cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
    if (p.round){ cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 7); cx.fill(); } else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  craf = parts.length ? requestAnimationFrame(stepC) : 0;
  if (!craf) cx.clearRect(0, 0, innerWidth, innerHeight);
}
function confettiAt(el, n){ const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n); }

    ], { duration: 820 + i * 120, easing:'cubic-bezier(.45,0,.55,1)' });

  if (c.ask) return c.ask;
  return w.pl ? 'Where are the {w}?' : 'Where is the {w}?';
}
const askText = (c, w, kind) => phrase(c, w, kind).replace('{w}', say(w));
const askHTML = (c, w, kind) => phrase(c, w, kind).replace('{w}', `<b>${say(w)}</b>`);
function gameHead(c, mode){

function renderDots(done, total, now){

function cheerOwl(){ const o = $('.mini-owl .owl'); if (o) retrigger(o, 'cheer'); }
const praise = () => pickOne(PRAISE);

/* ---------- Bul Bakalım ---------- */
function viewFind(id){
  const c = CAT[id];
  const order = shuffle(c.words).slice(0, FIND_ROUNDS);
  let round = 0, mistakes = 0, streak = 0, earned = 0, first = true, busy = false, target = null;
  app.innerHTML = gameHead(c, 'find') + promptHTML + `<p class="hint"><span>Dinle, doğru resme dokun!</span></p><div class="choices" id="choices"></div>`;
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  cleanup = () => timers.forEach(clearTimeout);
  function next(){
    if (round >= order.length) return finish();
    target = order[round]; first = true; busy = false;
    const opts = shuffle([target].concat(shuffle(c.words.filter(w => w !== target)).slice(0, 3)));
    const box = $('#choices');
    box.innerHTML = opts.map(w => `<button class="choice" data-act="choose" data-key="${w.key}" aria-label="Seçenek">${pic(w)}</button>`).join('');
    retrigger(box, 'fresh');
    later(() => box.classList.remove('fresh'), 700);
    $('#ask').innerHTML = askHTML(c, target);
    renderDots(round, order.length, round);
    later(() => speak(askText(c, target)), 380);
  }
  function finish(){
    const rating = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
    setBest(c, 'find', rating);
    renderDots(order.length, order.length, -1);
    endModal({ title: rating === 3 ? 'Süpersin!' : 'Harika!', en: rating === 3 ? 'Perfect!' : 'Great job!', rating, earned, actions: gameActions(c) });
  }
  viewActs.reask = () => { if (target) speak(askText(c, target)); };
  viewActs.choose = el => {
    if (busy || el.disabled) return;
    const w = WORD[el.dataset.key];
    if (w === target){
      busy = true;
      el.classList.add('right');
      el.insertAdjacentHTML('beforeend', `<span class="ok">${ICON.check}</span><span class="tag" lang="en">${say(w)}</span>`);
      sfx.good(); confettiAt(el, 34); cheerOwl();
      if (first){
        earned++; award(1, el); streak++;
        if (streak >= 3 && streak % 3 === 0) later(() => toast(`${streak} doğru üst üste!`, true), 300);
      }
      speak(`${say(w)}! ${praise()}`);
      round++;
      renderDots(round, order.length, -1);
      later(next, 1600);
    } else {
      el.classList.add('wrong'); el.disabled = true;
      el.insertAdjacentHTML('beforeend', `<span class="tag" lang="en">${say(w)}</span>`);
      sfx.bad(); mistakes++; first = false; streak = 0;
      speakSeq([say(w), askText(c, target)], 300);
    }
  };
  next();
}

function viewMemory(id){
  const c = CAT[id];
  const picks = shuffle(c.words).slice(0, MEMORY_PAIRS);
  const deck = shuffle(picks.concat(picks));
  let open = [], matched = 0, moves = 0, lock = false;
  app.innerHTML = gameHead(c, 'memory') + `<p class="hint"><span>Aynı iki resmi bul!</span><span><b id="moves">0</b> hamle</span></p>
    <div class="memory" id="mem" style="--cat:var(${c.color})">${deck.map((w, i) => `<button class="mcard" data-act="flip" data-i="${i}" aria-label="Kart ${i + 1}"><span class="mc-inner"><span class="mc-back"></span><span class="mc-front">${pic(w, true)}<small lang="en">${say(w)}</small></span></span></button>`).join('')}</div>`;
  renderDots(0, MEMORY_PAIRS, -1);
  const timers = [];
  cleanup = () => timers.forEach(clearTimeout);
  viewActs.flip = el => {
    if (lock || el.classList.contains('open') || el.classList.contains('done')) return;
    const w = deck[+el.dataset.i];
    el.classList.add('open'); sfx.flip(); speak(say(w));
    open.push(el);
    if (open.length < 2) return;
    moves++; $('#moves').textContent = moves;
    const [a, b] = open; open = [];
    if (deck[+a.dataset.i] === deck[+b.dataset.i]){
      lock = true;
      timers.push(setTimeout(() => {
        a.classList.add('done'); b.classList.add('done');
        sfx.good(); confettiAt(b, 22); matched++; lock = false;
        renderDots(matched, MEMORY_PAIRS, -1);
        if (matched === MEMORY_PAIRS) timers.push(setTimeout(() => {
          const rating = moves <= 9 ? 3 : moves <= 13 ? 2 : 1;
          const earned = rating + 2;
          setBest(c, 'memory', rating); award(earned, $('#mem'));
          endModal({ title:'Hepsini eşleştirdin!', en:'All matched!', rating, earned, actions: gameActions(c) });
        }, 700));
      }, 450));
    } else {
      lock = true;
      timers.push(setTimeout(() => { a.classList.remove('open'); b.classList.remove('open'); lock = false; }, 1150));
    }
  };
}

/* ---------- Balon Patlat ---------- */
function viewBalloon(id){
  const c = CAT[id];
  app.innerHTML = gameHead(c, 'balloon') + promptHTML + `<div class="sky-area" id="sky"><div class="sky-hint" id="sky-hint">Balonlar geliyor…</div></div>`;
  const sky = $('#sky');
  let Wd = sky.clientWidth, Ht = sky.clientHeight;
  const ro = window.ResizeObserver ? new ResizeObserver(() => { Wd = sky.clientWidth; Ht = sky.clientHeight; }) : null;
  if (ro) ro.observe(sky);
  let score = 0, mistakes = 0, earned = 0, target = null, running = true, busy = false;
  let list = [], lastLane = -1, sinceTarget = 0, spawnT = 0, raf = 0, last = performance.now();
  const timers = [];
  renderDots(0, BALLOON_GOAL, -1);
  const bw = () => Math.round(Math.min(100, Math.max(72, Wd / 4.3)));
  function newTarget(){
    const pool = c.words.filter(w => w !== target);
    target = pickOne(pool); sinceTarget = 0; busy = false;
    $('#ask').innerHTML = askHTML(c, target, 'pop');
    speak(askText(c, target, 'pop'));
  }
  function make(w, gold){
    const size = bw();
    const lanes = Math.max(2, Math.floor(Wd / (size * 1.08)));
    let lane; do { lane = rand(lanes); } while (lane === lastLane);
    lastLane = lane;
    const x = Math.round((Wd - size - 8) * (lane / (lanes - 1))) + 4;
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'balloon' + (gold ? ' gold' : '');
    el.style.setProperty('--b', gold ? 'var(--sun)' : (w.color || pickOne(BALLOON_COLORS)));
    el.style.width = size + 'px';
    el.style.fontSize = Math.round(size * .44) + 'px';
    el.innerHTML = `<span class="b-face">${gold ? star() : (w.color ? '' : pic(w, true))}</span>`;
    el.setAttribute('aria-label', gold ? 'Altın yıldız balonu' : say(w));
    const b = { el, w, gold, x, h: size * 1.2 + 70, y: Ht + 10, speed: (Ht + size * 2) / (8 + Math.random() * 3), phase: Math.random() * 6.3, gone: false, popping: false };
    el._b = b;
    sky.appendChild(el);
    list.push(b);
  }
  function spawn(){
    if (!running) return;
    if (list.filter(b => !b.gone).length < 6){
      const hasT = list.some(b => !b.gone && !b.popping && b.w === target);
      if (Math.random() < .07) make(null, true);
      else {
        let w;
        if (!hasT || sinceTarget >= 2 || Math.random() < .3){ w = target; sinceTarget = 0; }
        else { w = pickOne(c.words.filter(x => x !== target)); sinceTarget++; }
        make(w, false);
      }
    }
    spawnT = setTimeout(spawn, 950 + Math.random() * 650);
  }
  function tick(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (const b of list){
      if (b.gone || b.popping) continue;
      b.y -= b.speed * dt;
      b.el.style.transform = `translate(${b.x + Math.sin(now / 700 + b.phase) * 7}px,${b.y}px)`;
      if (b.y < -b.h){ b.gone = true; b.el.remove(); }
    }
    list = list.filter(b => !b.gone);
    if (running || list.length) raf = requestAnimationFrame(tick);
  }
  function popIt(b){
    b.popping = true;
    retrigger(b.el, 'popped');
    confettiAt(b.el, 20);
    timers.push(setTimeout(() => { b.gone = true; b.el.remove(); }, 230));
  }
  sky.addEventListener('pointerdown', e => {
    const el = e.target.closest('.balloon');
    if (!el || !el._b || !running) return;
    e.preventDefault();
    const b = el._b;
    if (b.gone || b.popping) return;
    if (b.gold){ popIt(b); sfx.pop(); award(2, el); speak('Bonus star!'); return; }
    if (b.w === target){
      popIt(b); sfx.pop();
      if (busy) return;
      busy = true; score++; earned++;
      sfx.good(); award(1, el); cheerOwl();
      renderDots(score, BALLOON_GOAL, -1);
      speak(`${say(b.w)}! ${praise()}`);
      if (score >= BALLOON_GOAL){
        running = false; clearTimeout(spawnT);
        timers.push(setTimeout(() => {
          const rating = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
          setBest(c, 'balloon', rating);
          endModal({ title:'Bütün balonlar patladı!', en:'Pop, pop, hooray!', rating, earned, actions: gameActions(c) });
        }, 1100));
      } else timers.push(setTimeout(newTarget, 1400));
    } else {
      retrigger(el, 'wobble'); sfx.bad(); mistakes++;
      speakSeq([say(b.w), askText(c, target, 'pop')], 300);
    }
  });
  viewActs.reask = () => { if (target) speak(askText(c, target, 'pop')); };
  timers.push(setTimeout(() => {
    const h = $('#sky-hint'); if (h) h.remove();
    Wd = sky.clientWidth; Ht = sky.clientHeight;
    newTarget(); spawn();
  }, 700));
  raf = requestAnimationFrame(t => { last = t; tick(t); });
  cleanup = () => { running = false; clearTimeout(spawnT); cancelAnimationFrame(raf); timers.forEach(clearTimeout); if (ro) ro.disconnect(); };
}

/* ================= sürükle-bırak veya dokun-seç / dokun-bırak ================= */
// Aynı ekranda iki yol: (1) nesneyi sürükleyip sepete bırak, (2) nesneye dokun (seçilir), sonra sepete dokun.
// Klavye / ekran okuyucu: nesneler ve sepet birer düğme; Enter/Boşluk ile dokunma yolu çalışır.
function makePlacer(root, o){
  let selected = null, drag = null, suppress = 0, selT = 0, dropDownAt = 0;
  const target = o.target;
  const locked = () => !!(o.locked && o.locked());
  const LIFT = 28;                                   // hayalet parmağın 28 px üstünde: el nesneyi kapatmasın
  function setSel(el){
    clearTimeout(selT);
    if (selected){ selected.classList.remove('selected'); selected.setAttribute('aria-pressed', 'false'); }
    selected = el || null;
    if (selected){
      selected.classList.add('selected'); selected.setAttribute('aria-pressed', 'true');
      // Seçip bekleyen çocuğa bir kez "şimdi sepete dokun" gösterilir.
      if (o.onSelectIdle) selT = setTimeout(() => { if (selected === el && !locked()) o.onSelectIdle(el); }, 4000);
    }
    target.classList.toggle('awaiting', !!selected);
    target.setAttribute('aria-label', selected ? `Sepete koy: ${selected.dataset.name || ''}` : 'Sepet');
  }
  function near(x, y){
    const r = target.getBoundingClientRect(), pad = 30;
    return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
  }
  function sendBack(d){
    const g = d.ghost, el = d.el;
    if (!g){ el.classList.remove('dragging'); return; }
    const r = el.getBoundingClientRect();
    g.style.transition = reduced ? 'none' : 'transform .3s cubic-bezier(.3,1.3,.5,1)';
    g.style.transform = `translate(${r.left}px,${r.top}px)`;
    setTimeout(() => { g.remove(); el.classList.remove('dragging'); }, reduced ? 0 : 310);
  }
  // Ekran kilitlenir, boyut değişir ya da tarayıcı parmağı elinden alırsa: sessizce geri, seçili kalır.
  function cancelDrag(){
    if (!drag) return;
    const d = drag; drag = null; target.classList.remove('hover');
    if (d.moved){ suppress = Date.now(); sendBack(d); if (!locked()) setSel(d.el); }
  }
  function down(e){
    if (e.target.closest('[data-drop]') === target) dropDownAt = performance.now();
    if (e.button > 0 || drag || !e.isPrimary) return;
    if (e.pointerType === 'touch' && (e.width >= 60 || e.height >= 60)) return;   // avuç / dayanan el
    const el = e.target.closest('[data-item]');
    if (!el || !root.contains(el) || el.disabled || locked()) return;
    drag = { el, id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false, ghost: null };
  }
  function move(e){
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved){
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < (e.pointerType === 'mouse' ? 5 : 9)) return;
      if (locked()){ drag = null; return; }
      drag.moved = true;
      const r = drag.el.getBoundingClientRect(), g = drag.el.cloneNode(true);
      g.removeAttribute('data-item'); g.removeAttribute('id'); g.setAttribute('aria-hidden', 'true');
      g.classList.remove('selected', 'hint-glow', 'soft'); g.classList.add('drag-ghost');
      g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
      drag.gx = r.width / 2; drag.gy = r.height / 2 + LIFT;
      document.body.appendChild(g); drag.ghost = g;
      drag.el.classList.add('dragging');
      setSel(null);
      try { drag.el.setPointerCapture(e.pointerId); } catch (_) {}
      drag.el.addEventListener('lostpointercapture', cancelDrag, { once: true });
      if (o.onDragStart) o.onDragStart(drag.el);
    }
    if (e.cancelable) e.preventDefault();
    drag.ghost.style.transform = `translate(${e.clientX - drag.gx}px,${e.clientY - drag.gy}px) scale(1.1)`;
    target.classList.toggle('hover', near(e.clientX, e.clientY - LIFT));
  }
  function up(e){
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    d.el.removeEventListener('lostpointercapture', cancelDrag);
    if (!d.moved) return;                 // kısa dokunuş: click olayı seçimi yapar
    suppress = Date.now();
    target.classList.remove('hover');
    if (!locked() && (near(e.clientX, e.clientY) || near(e.clientX, e.clientY - LIFT))){
      const from = d.ghost.getBoundingClientRect();
      // onPlace false dönerse (yanlış nesne) nesne yerine geri süzülür; doğruysa sepete girer.
      if (o.onPlace(d.el, from) === false) sendBack(d);
      else { d.ghost.remove(); d.el.classList.remove('dragging'); }
    } else {
      sendBack(d);                        // sepetin dışına bırakıldı: sessizce geri döner, seçili kalır
      if (!locked()) setSel(d.el);
    }
  }
  function cancel(e){ if (drag && e.pointerId === drag.id) cancelDrag(); }
  function touchBlock(e){ if (drag && drag.moved && e.cancelable) e.preventDefault(); }
  function click(e){
    if (Date.now() - suppress < 450){ e.stopPropagation(); return; }
    const el = e.target.closest('[data-item]');
    if (el && root.contains(el)){
      e.stopPropagation();
      if (locked() || el.disabled) return;
      const again = selected === el;
      if (!again) setSel(el);
      if (o.onSelect) o.onSelect(el, again);
      return;
    }
    const t = e.target.closest('[data-drop]');
    if (t === target){
      e.stopPropagation();
      // Sepete uzun süre dayanan el (1,5 sn+) dokunuş sayılmaz. Klavye (detail 0) her zaman geçer.
      if (e.detail && dropDownAt && performance.now() - dropDownAt > 1500) return;
      if (locked()) return;
      if (selected){ const el2 = selected, from = el2.getBoundingClientRect(); setSel(null); o.onPlace(el2, from); }
      else if (o.onEmptyTarget) o.onEmptyTarget();
    }
  }
  root.addEventListener('pointerdown', down);
  root.addEventListener('touchmove', touchBlock, { passive: false });
  window.addEventListener('pointermove', move, { passive: false });
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', cancel);
  window.addEventListener('resize', cancelDrag);
  root.addEventListener('click', click);
  return {
    clear(){ setSel(null); },
    preselect(el){ if (el) setSel(el); },
    get selected(){ return selected; },
    cancelDrag,
    destroy(){
      clearTimeout(selT);
      if (drag && drag.ghost) drag.ghost.remove();
      drag = null;
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', cancel);
      window.removeEventListener('resize', cancelDrag);
      root.removeEventListener('pointerdown', down);
      root.removeEventListener('touchmove', touchBlock);
      root.removeEventListener('click', click);
      $$('.drag-ghost').forEach(g => g.remove());
    }
  };
}
// Bir nesnenin kopyasını bir noktadan hedefe uçurur (sepete girme animasyonu). Animasyonu döndürür.
function flyInto(fromRect, toEl, html, done){
  const to = toEl.getBoundingClientRect();
  if (reduced || !document.body.animate){ if (done) done(); return null; }
  const f = document.createElement('div');
  f.className = 'fly-item'; f.innerHTML = html; f.setAttribute('aria-hidden', 'true');
  const size = Math.min(fromRect.width, 96);
  f.style.width = size + 'px'; f.style.height = size + 'px'; f.style.fontSize = Math.round(size * .62) + 'px';
  document.body.appendChild(f);
  const x0 = fromRect.left + fromRect.width / 2 - size / 2, y0 = fromRect.top + fromRect.height / 2 - size / 2;
  const x1 = to.left + to.width / 2 - size / 2, y1 = to.top + to.height * .35 - size / 2;
  const a = f.animate([
    { transform: `translate(${x0}px,${y0}px) scale(1)` },
    { transform: `translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 70}px) scale(1.15)`, offset: .5 },
    { transform: `translate(${x1}px,${y1}px) scale(.55)`, opacity: .9 }
  ], { duration: 560, easing: 'cubic-bezier(.4,0,.4,1)' });
  a.onfinish = () => { f.remove(); if (done) done(); };
  a.oncancel = () => f.remove();
  return a;
}

function makeHand(at){

const handTap = h => { if (h) retrigger(h, 'tap'); };
function demoMove(fromEl, toEl){

let curTask = null;
// Bir etkinliğin ortak durumu: zamanlayıcılar, tekrar dinlenecek cümle, bekleme ipuçları, sahne koruması.
function makeTask(){
  const t = { alive: true, timers: [], anims: [], line: null, speaking: false, talkId: 0, step: 0, demo: null, pic: false,
    idle: [], idleStage: 0, idleT: 0, readyAt: 0, placer: null, lastReplay: 0 };
  curTask = t;
  t.later = (fn, ms) => { const id = setTimeout(() => { if (t.alive) fn(); }, ms); t.timers.push(id); return id; };
  t.guard = ms => { t.readyAt = performance.now() + ms; };          // sahne değişince çift dokunuş taşmasın
  t.ready = () => performance.now() >= t.readyAt;
  // Resimli mod: cihazda Türkçe ses yoksa (ya da kapalıysa) yönergeler el gösterimi ve resimle verilir.
  t.checkPic = () => { t.pic = trState() !== 'ok'; return t.pic; };
  // Balon her sahnede sabit, kısa içerik gösterir (İngilizce kelime); ipuçları balonu değiştirmez.
  t.bubble = html => { const el = $('#tell-text'); if (el) el.innerHTML = html; };
  t.fly = (from, toEl, w, into) => {
    const bi = into || $('#basket-in');
    const a = flyInto(from, toEl, pic(w), () => { if (t.alive && bi && bi.isConnected) bi.insertAdjacentHTML('beforeend', `<span>${pic(w, true)}</span>`); });
    if (a) t.anims.push(a);
  };
  t.talk = (segs, replay) => {
    t.line = replay || segs;
    const my = ++t.talkId; t.speaking = true; clearTimeout(t.idleT);
    const tell = $('.tell'); if (tell) tell.classList.add('talking');
    return speakLine(segs).then(ok => {
      if (my === t.talkId){
        t.speaking = false;
        const tl = $('.tell'); if (tl) tl.classList.remove('talking');
        if (t.alive) t.armIdle();
      }
      return ok;
    });
  };
  // Yanlış cevapta ipucu, çalan sözü kelimenin ortasında kesmez: parça sonunu (en çok 1,2 sn) bekler.
  t.talkSoon = (segs, replay) => {
    if (!t.speaking) return t.talk(segs, replay);
    const my = t.talkId, step = t.step;
    return Promise.race([new Promise(r => segWaiters.push(r)), wait(1200)])
      .then(() => (t.alive && step === t.step && my === t.talkId) ? t.talk(segs, replay) : false);
  };
  // Bekleme merdiveni: söz bittikten 8 sn sonra 1. ipucu, 12 sn sonra 2. ipucu, sonra susar. Dokunuş sayacı sıfırlar.
  t.setIdle = fns => { t.idle = fns || []; t.idleStage = 0; t.armIdle(); };
  t.armIdle = () => {
    clearTimeout(t.idleT);
    if (!t.alive || t.speaking || t.idleStage >= t.idle.length) return;
    t.idleT = setTimeout(() => {
      if (!t.alive) return;
      if (document.hidden || t.speaking || !modalRoot.hidden){ t.armIdle(); return; }
      const fn = t.idle[t.idleStage++];
      fn();
      t.armIdle();
    }, t.idleStage === 0 ? 8000 : 12000);
  };
  t.poke = () => { if (!t.speaking) t.armIdle(); };
  t.clearStep = () => {
    t.timers.forEach(clearTimeout); t.timers = [];
    t.anims.forEach(a => { try { a.cancel(); } catch (e) {} }); t.anims = [];
    clearTimeout(t.idleT); t.idle = []; t.talkId++; t.speaking = false; t.step++; t.demo = null;
    if (t.placer){ t.placer.destroy(); t.placer = null; }
    $$('.hand, .fly-item').forEach(h => h.remove());
  };
  t.end = () => {
    t.alive = false; t.clearStep();
    if (curTask === t) curTask = null;
    app.removeEventListener('pointerdown', t.poke);
    app.removeEventListener('keydown', t.poke);
  };
  app.addEventListener('pointerdown', t.poke);
  app.addEventListener('keydown', t.poke);
  viewActs.replay = () => {
    const now = performance.now();
    if (!t.line || now - t.lastReplay < 700) return;      // çekiç gibi basılan tekrar düğmesi sesi kilitlemesin
    t.lastReplay = now; sfx.tap(); t.talk(t.line, t.line);
    if (t.pic && t.demo) t.demo();                         // resimli modda gösterim de yinelenir
  };
  return t;
}

/* ---------- Bubu'nun Pikniği (hikâye) ---------- */
const PICNIC_STEPS = ['intro', 'teach-apple', 'task-apple', 'teach-red', 'task-red', 'teach-rabbit', 'task-rabbit', 'finale', 'sticker'];
function viewStory(){
  const APPLE = WORD['fruits:apple'], RED = WORD['colors:red'], RABBIT = WORD['animals:rabbit'];
  const rec = picnicRec();
  const firstPlay = rec.plays === 0;
  const T = makeTask();
  cleanup = T.end;
  let i = 0, advancing = false, chosen = null, demoDone = !firstPlay;
  const word = w => `<b lang="en">${A(say(w)).slice(0, -1)}</b>`;
  const stepOf = id => /apple/.test(id) ? 0 : /red/.test(id) ? 1 : /rabbit/.test(id) ? 2 : (id === 'finale' || id === 'sticker') ? 3 : -1;
  function bar(){
    const cur = stepOf(PICNIC_STEPS[i]);
    const icons = [pic(APPLE, true), `<span class="blob" style="--blob:${RED.color}"></span>`, pic(RABBIT, true), star()];
    return actBar(`<div class="steps">${icons.map((h, k) => `<span class="step${k < cur ? ' done' : ''}${k === cur ? ' now' : ''}">${h}</span>`).join('')}</div>`);
  }
  function render(){
    T.clearStep(); advancing = false;
    const id = PICNIC_STEPS[i];
    app.innerHTML = `<div class="act" id="act">${bar()}<div class="act-body" id="sb" tabindex="-1"></div></div>`;
    T.guard(id === 'sticker' ? 700 : 500);
    T.checkPic();
    STEP[id]($('#sb'));
    try { $('#sb').focus({ preventScroll: true }); } catch (e) {}
  }
  function next(){
    if (!T.alive || i >= PICNIC_STEPS.length - 1) return;
    if (document.hidden){ T.later(next, 600); return; }      // arka plandayken hikâye kendi kendine ilerlemesin
    i++; render();
  }
  function advance(ms){ if (advancing) return; advancing = true; T.later(next, ms); }
  viewActs.next = () => { if (!T.ready()) return; sfx.tap(); next(); };
  function setWant(html, lvl){ const wp = $('#want-pic'); if (!wp) return; wp.innerHTML = html; wp.className = 'want-pic lvl' + lvl; wp.hidden = false; retrigger(wp, 'reveal-pic'); }

      <span class="teach-word" lang="en">${say(w)}</span>${S.settings.showTr ? `<span class="teach-tr">${w.tr}</span>` : ''}</div></div>` + goRow('Devam', true);
    T.bubble(word(w));
    const segs = [['tr', intro], ['en', A(say(w))], ['tr', 'Sen de söyle!'], ['pause', 1500], ['en', A(say(w))]];
    const showNext = () => { const n = $('.next-btn', b); if (n) n.hidden = false; };   // ▶ kelime duyulduktan sonra çıkar
    T.talk(segs).then(showNext);
    T.later(showNext, 7000);
    viewActs.teachhear = el => { retrigger(el, 'bounce'); sfx.tap(); if (!T.speaking) speakLine([['en', A(say(w))]]); };
    T.setIdle([() => { T.talk([['tr', 'Devam etmek için yeşil düğmeye dokun.']], segs); const n = $('.next-btn', b); if (n) retrigger(n, 'hop'); }]);
  }
  const STEP = {
    intro(b){
      b.innerHTML = tellHTML() + `<div class="act-main"><div class="stage scene-intro">${ORB}<span class="scene-tree emo" aria-hidden="true">🌳</span><span class="scene-basket">${basketSVG()}</span><span class="scene-flower emo" aria-hidden="true">🌼</span></div></div>` + goRow('Başla');
      T.bubble('<span lang="tr">Bubu’nun Pikniği</span>');
      const go = [['tr', 'Yeşil düğmeye dokun.']];
      T.talk((firstPlay ? [['tr', 'Bugün Bubu pikniğe gidiyor!'], ['tr', 'Hadi, ona yardım edelim.']] : [['tr', 'Yine pikniğe gidiyoruz!']]).concat(go));
      T.setIdle([() => { T.talk(go); const n = $('.next-btn'); if (n) retrigger(n, 'hop'); }]);
    },
    'teach-apple'(b){ teach(b, APPLE, 'Bak, bu bir elma. İngilizcesi:'); },
    'teach-red'(b){ teach(b, RED, 'Bak, bu renk kırmızı. Elma kırmızı, balon kırmızı. İngilizcesi:', '<span class="teach-extra" aria-hidden="true"><span class="emo">🍎</span><span class="emo">🎈</span></span>'); },
    'teach-rabbit'(b){ teach(b, RABBIT, 'Bak, bu bir tavşan. İngilizcesi:'); },
    'task-apple'(b){
      const BREAD = WORD['food:bread'];
      const demoing0 = !demoDone || T.pic;

        onSelect: el => { sfx.tap(); if (!T.speaking) speakLine([['en', A(say(WORD[el.dataset.key]))]]); },
        onSelectIdle: el => { retrigger($('#basket'), 'hop'); if (T.pic) demoMove(el, $('#basket')); else T.talk([['tr', 'Şimdi sepete dokun.']], prompt); },

      // "Önce ben yapayım": el ekmeğe dokunur, sonra sepete; ekmek sepete girer. İlk oyunda ve resimli modda.
