<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#AEE2FF">
</head>
<body>
<title>Bubu ile İngilizce</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: oyuncak kutusu — kalın çizgili, sert gölgeli "oyuncak blok" kartlar; gökyüzü + tepeler sahnesi; her ekranda tek iş */
:root{
  --sky:#AEE2FF; --sky-deep:#79C8F2; --cloud:#FFFFFF; --twinkle:transparent;
  --hill-1:#86D873; --hill-2:#62C25C;
  --paper:#FFFFFF; --paper-2:#EAF4FF; --empty:#DCE6F2;
  --line:#1E2A4A; --text:#1E2A4A; --text-soft:#4D5C82; --on-candy:#1E2A4A;
  --sun:#FFC52E; --hl:#FFE27A; --good-soft:#C9F3D9; --focus:#1E2A4A;
  --scrim:rgba(22,34,70,.55);
  --sil:brightness(0) opacity(.14);
  --c-red:#FF8A7A; --c-orange:#FFB347; --c-yellow:#FFD84D; --c-lime:#CBE96A; --c-green:#8BDB76;
  --c-teal:#6ED9C6; --c-blue:#8DC4FF; --c-violet:#BCA4FF; --c-pink:#FFA3CF; --c-sand:#F5CF94;
  --font-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r-lg:26px; --r-md:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#14204A; --sky-deep:#0C1636; --cloud:#1E2C5E; --twinkle:#FFF3B8;
    --hill-1:#1C4A3A; --hill-2:#15392D;
    --paper:#24366A; --paper-2:#1B2A58; --empty:#31447A;
    --line:#060A1A; --text:#F3F6FF; --text-soft:#B7C3EA; --on-candy:#1E2A4A;
    --sun:#FFCB3D; --hl:rgba(255,203,61,.38); --good-soft:#1E5C46; --focus:#FFCB3D;
    --scrim:rgba(0,0,0,.62);
    --sil:brightness(0) invert(1) opacity(.16);
    --c-red:#F58676; --c-orange:#F7AA42; --c-yellow:#F7D24A; --c-lime:#C2E063; --c-green:#80D06D;
    --c-teal:#62CDBB; --c-blue:#82B9F5; --c-violet:#AF98F5; --c-pink:#F598C4; --c-sand:#EAC487;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#14204A; --sky-deep:#0C1636; --cloud:#1E2C5E; --twinkle:#FFF3B8;
  --hill-1:#1C4A3A; --hill-2:#15392D;
  --paper:#24366A; --paper-2:#1B2A58; --empty:#31447A;
  --line:#060A1A; --text:#F3F6FF; --text-soft:#B7C3EA; --on-candy:#1E2A4A;
  --sun:#FFCB3D; --hl:rgba(255,203,61,.38); --good-soft:#1E5C46; --focus:#FFCB3D;
  --scrim:rgba(0,0,0,.62);
  --sil:brightness(0) invert(1) opacity(.16);
  --c-red:#F58676; --c-orange:#F7AA42; --c-yellow:#F7D24A; --c-lime:#C2E063; --c-green:#80D06D;
  --c-teal:#62CDBB; --c-blue:#82B9F5; --c-violet:#AF98F5; --c-pink:#F598C4; --c-sand:#EAC487;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sky);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sky)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:3px dashed var(--focus);outline-offset:3px}
h1,h2,h3{font-family:var(--font-display);line-height:1.05;margin:0;text-wrap:balance}
.emo{display:inline-block;line-height:1;font-family:var(--font-emoji)}

/* ---------- sahne ---------- */
.scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.scene::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 8% 12%,var(--twinkle) 0 1.6px,transparent 2.4px),
  radial-gradient(circle at 23% 30%,var(--twinkle) 0 1.2px,transparent 2px),
  radial-gradient(circle at 41% 9%,var(--twinkle) 0 2px,transparent 2.8px),
  radial-gradient(circle at 62% 22%,var(--twinkle) 0 1.3px,transparent 2px),
  radial-gradient(circle at 78% 8%,var(--twinkle) 0 1.8px,transparent 2.6px),
  radial-gradient(circle at 92% 28%,var(--twinkle) 0 1.4px,transparent 2.2px),
  radial-gradient(circle at 54% 44%,var(--twinkle) 0 1.2px,transparent 2px),
  radial-gradient(circle at 14% 58%,var(--twinkle) 0 1.5px,transparent 2.3px),
  radial-gradient(circle at 86% 52%,var(--twinkle) 0 1.6px,transparent 2.4px)}
.cloud{position:absolute;width:96px;height:30px;border-radius:30px;background:var(--cloud);opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:46px;height:46px;left:14px;top:-24px}
.cloud::after{width:36px;height:36px;left:48px;top:-15px}
.cloud.k1{top:16%;animation-duration:80s;animation-delay:-20s}
.cloud.k2{top:38%;animation-duration:110s;animation-delay:-70s;transform:scale(.7)}
.cloud.k3{top:64%;animation-duration:95s;animation-delay:-45s}
.hill{position:absolute;border-radius:50%}
.hill.h1{left:-12%;bottom:-70px;width:72%;height:170px;background:var(--hill-1)}
.hill.h2{right:-18%;bottom:-110px;width:78%;height:210px;background:var(--hill-2)}

/* ---------- üst çubuk ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sky)}
.topbar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;min-width:0}
.logo .owl{width:40px;height:42px;flex:none}
.logo-text{font-family:var(--font-display);font-weight:800;font-size:25px;line-height:.85;display:flex;flex-direction:column;text-align:left}
.logo-text small{font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--text-soft);line-height:1.3}
.stats{display:flex;align-items:center;gap:6px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 11px 0 7px;background:var(--paper);border:3px solid var(--line);border-radius:999px;box-shadow:0 3px 0 var(--line);font-family:var(--font-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;color:var(--text)}
.pill svg{width:24px;height:24px;flex:none}
.pill.bump{animation:bump .4s}
.chest-pill{width:40px;padding:0;justify-content:center;background:conic-gradient(var(--sun) calc(var(--p,0) * 1%),var(--paper) 0)}
.chest-pill .ring-in{width:27px;height:27px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.chest-pill .chest{width:22px;height:20px}
.chest-pill.ready{animation:jiggle 1.4s infinite}
.gear{position:relative;width:40px;height:40px;flex:none;border-radius:50%;border:3px solid var(--line);background:var(--paper);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;padding:0;color:var(--text-soft);overflow:hidden}
.gear::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--sun);transform:scale(0);transition:transform .15s}
.gear.holding::before{transform:scale(1);transition:transform 1.1s linear}
.gear svg{position:relative;width:21px;height:21px}
.gear-hole{fill:var(--paper)}

/* ---------- genel ---------- */
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 120px;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 20px;background:var(--paper);color:var(--text);border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.1;transition:transform .08s,box-shadow .08s}
.btn.small{min-height:42px;font-size:16px;padding:6px 14px}
.btn.primary{background:var(--sun);color:var(--on-candy)}
.btn.danger{background:var(--paper-2);color:var(--text)}
.btn.armed{background:var(--c-red);color:var(--on-candy)}
.btn svg{width:20px;height:20px;flex:none}
.btn:active,.cat-tile:active,.word-card:active,.choice:active,.game-btn:active,.back:active,.say-btn:active,.pill:active,.album-banner:active,.wod:active,.sticker:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.star-ico .st{fill:var(--sun);stroke:var(--line);stroke-width:7;stroke-linejoin:round}
.star-ico.off .st{fill:var(--empty)}
.stk{fill:var(--c-pink);stroke:var(--line);stroke-width:2;stroke-linejoin:round}
.stk-fold{fill:var(--paper);stroke:var(--line);stroke-width:2;stroke-linejoin:round}

/* ---------- resimler ---------- */
.blob{display:inline-block;width:1em;height:1em;background:var(--blob);border:.055em solid var(--line);border-radius:58% 42% 55% 45% / 48% 58% 42% 52%;box-shadow:inset -.07em -.09em 0 rgba(0,0,0,.14),inset .07em .07em 0 rgba(255,255,255,.4)}
.shape{display:block;width:1em;height:1em;overflow:visible}
.numpic{display:flex;flex-direction:column;align-items:center;gap:.05em}
.digit{font-family:var(--font-display);font-weight:800;line-height:.85;color:var(--d);-webkit-text-stroke:.035em var(--line);paint-order:stroke fill}
.numpic .digit{font-size:.78em}
.ndots{display:grid;grid-template-columns:repeat(5,.15em);gap:.05em;justify-content:center}
.ndots i{width:.15em;height:.15em;border-radius:50%;background:var(--d);border:.025em solid var(--line)}

/* ---------- maskot ---------- */
.owl{overflow:visible}
.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5s infinite}
.owl.cheer{animation:hop .75s cubic-bezier(.3,1.4,.5,1)}
.owl .wing{transform-box:fill-box}
.owl .wing-l{transform-origin:90% 10%}
.owl .wing-r{transform-origin:10% 10%}
.owl.cheer .wing-l{animation:flap-l .25s 3}
.owl.cheer .wing-r{animation:flap-r .25s 3}

/* ---------- ana sayfa ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;gap:6px 16px;margin-block:10px 26px}
.owl-btn{background:none;border:0;padding:0;width:clamp(92px,25vw,150px)}
.owl-btn .owl{width:100%;height:auto;display:block}
.bubble{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--line);padding:14px 16px 16px;display:grid;gap:12px;margin-bottom:22px;min-width:0}
.bubble::before,.prompt-bubble::before{content:"";position:absolute;left:-13px;bottom:24px;width:22px;height:22px;background:var(--paper);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg) skew(10deg,10deg)}
.bubble-text{margin:0;font-weight:800;font-size:clamp(16px,4.2vw,20px);line-height:1.3}
.wod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 12px;text-align:left;background:var(--cat);color:var(--on-candy);border:3px solid var(--line);border-radius:var(--r-md);box-shadow:0 4px 0 var(--line);padding:9px 12px 11px;transition:transform .08s,box-shadow .08s}
.wod-tag{grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.wod-pic{font-size:46px;line-height:1;display:grid;place-items:center}
.wod-words{min-width:0}
.wod-words b{display:block;font-family:var(--font-display);font-size:30px;line-height:1}
.wod-words small{font-weight:800;font-size:14px}
.wod-say{width:46px;height:46px;border-radius:50%;background:var(--paper);color:var(--text);border:3px solid var(--line);display:grid;place-items:center}
.wod-say svg{width:24px;height:24px}

.section-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-block:4px 14px}
.section-head h2{font-size:30px}
.section-head .en{font-family:var(--font-display);font-weight:700;color:var(--text-soft);font-size:18px}
.section-head .learned{margin-left:auto;font-weight:800;font-size:14px;color:var(--text-soft);font-variant-numeric:tabular-nums}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px 14px}
.cat-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--cat);color:var(--on-candy);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);padding:12px 14px 13px;transition:transform .08s,box-shadow .08s;min-width:0}
.cat-icon{font-size:48px;line-height:1.1;transition:transform .2s}
.cat-tile:hover .cat-icon{transform:rotate(-8deg) scale(1.08)}
.cat-name{font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.05;margin-top:4px}
.cat-en{font-weight:800;font-size:13px;opacity:.78;letter-spacing:.02em}
.cat-foot{display:flex;align-items:center;gap:8px;margin-top:10px;width:100%}
.bar{flex:1;height:11px;border-radius:99px;background:rgba(255,255,255,.6);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--line);border-radius:99px}
.medals{display:flex;gap:1px}
.medals svg{width:15px;height:15px}
.medals .star-ico.off .st{fill:rgba(255,255,255,.6)}
.crown{position:absolute;top:-18px;right:8px;font-size:32px;transform:rotate(14deg);filter:drop-shadow(0 2px 0 var(--line))}

.album-banner{margin-top:26px;width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);padding:14px 16px;transition:transform .08s,box-shadow .08s}
.fan{display:flex;flex:none;padding-left:18px}
.fan span{width:50px;height:58px;border:3px solid var(--line);border-radius:12px;background:var(--paper-2);display:grid;place-items:center;font-size:28px;margin-left:-18px;transform:rotate(var(--r));box-shadow:0 3px 0 var(--line)}
.ab-text{min-width:0;display:grid;gap:2px}
.ab-text b{font-family:var(--font-display);font-size:22px;line-height:1.1}
.ab-text small{font-weight:700;color:var(--text-soft);font-size:14px}

/* ---------- sayfa başlığı ---------- */
.page-head{display:flex;align-items:center;gap:10px;margin-block:6px 18px}
.back{width:50px;height:50px;flex:none;border-radius:16px;background:var(--paper);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:0;color:var(--text);transition:transform .08s,box-shadow .08s}
.back svg{width:26px;height:26px}
.ph-icon{width:54px;height:54px;flex:none;display:grid;place-items:center;font-size:32px;background:var(--cat);border:3px solid var(--line);border-radius:16px;transform:rotate(-5deg)}
.ph-title{min-width:0;flex:1}
.ph-title h1{font-size:clamp(23px,6.4vw,34px)}
.ph-title span{display:block;font-family:var(--font-display);font-weight:700;color:var(--text-soft);font-size:16px;line-height:1.2}
.ph-icon svg{width:100%;height:100%}
.ph-count{flex:none;font-family:var(--font-display);font-weight:800;font-size:18px;background:var(--paper);border:3px solid var(--line);border-radius:99px;padding:3px 12px;font-variant-numeric:tabular-nums}

/* ---------- bölüm: oyunlar + kelimeler ---------- */
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.game-btn{position:relative;display:flex;flex-direction:column;align-items:center;padding:10px 6px 10px;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);box-shadow:0 5px 0 var(--line);text-align:center;transition:transform .08s,box-shadow .08s;min-width:0}
.game-ico{font-size:36px;line-height:1.15}
.game-name{font-family:var(--font-display);font-weight:800;font-size:16px;line-height:1.05}
.game-en{font-size:12px;font-weight:800;color:var(--text-soft)}
.game-btn .rate{display:flex;gap:1px;margin-top:5px}
.game-btn .rate svg{width:15px;height:15px}
.game-btn.locked{background:var(--paper-2)}
.game-btn.locked .game-ico{filter:grayscale(1);opacity:.45}
.lock{margin-top:5px;font-size:12px;font-weight:800;background:var(--sun);color:var(--on-candy);border:2px solid var(--line);border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
.games.fresh .game-btn{animation:pop-in .55s backwards}
.games.fresh .game-btn:nth-child(2){animation-delay:.12s}
.games.fresh .game-btn:nth-child(3){animation-delay:.24s}
.nope{animation:shake .45s}

.explore-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.explore-bar p{margin:0;font-weight:800;color:var(--text-soft)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:14px 12px}
.word-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:142px;padding:12px 4px 10px;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-md);box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s;min-width:0}
.word-card.is-new{background:var(--paper-2)}
.word-card.is-new::after{content:"YENİ";position:absolute;top:-11px;right:-6px;background:var(--sun);color:var(--on-candy);font-weight:800;font-size:11px;letter-spacing:.06em;padding:1px 7px;border:2.5px solid var(--line);border-radius:99px;transform:rotate(9deg)}
.word-card .pic{font-size:clamp(48px,13vw,64px);line-height:1;display:grid;place-items:center;min-height:1.1em}
.word-card .label{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:2.5em;text-align:center;max-width:100%}
.word-card .label b{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1}
.word-card .label b.long{font-size:16px}
.word-card .label b.xlong{font-size:14px}
.word-card .label small{font-weight:700;font-size:13px;color:var(--text-soft);line-height:1.2}
.word-card .label .q{color:var(--text-soft);letter-spacing:.18em;font-size:22px}
.word-card.bounce .pic{animation:boing .55s}
.word-card.reveal .label{animation:pop-in .45s}
.word-card.glow{box-shadow:0 5px 0 var(--line),0 0 0 6px var(--sun)}

/* ---------- oyun ekranları ---------- */
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:118px;flex:none}
.dots i{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--line);background:var(--paper);transition:background .2s,transform .2s}
.dots i.on{background:var(--sun)}
.dots i.now{transform:scale(1.3)}
.prompt{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}
.mini-owl{width:clamp(62px,17vw,84px);flex:none}
.mini-owl .owl{width:100%;height:auto;display:block}
.prompt-bubble{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--line);padding:12px 12px 12px 18px;margin-bottom:14px}
.ask{font-family:var(--font-display);font-weight:700;font-size:clamp(21px,5.8vw,32px);line-height:1.1;min-width:0}
.ask b{font-weight:800;background:linear-gradient(transparent 62%,var(--hl) 62%);padding:0 .08em}
.say-btn{width:56px;height:56px;flex:none;border-radius:50%;background:var(--sun);color:var(--on-candy);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:0;transition:transform .08s,box-shadow .08s}
.say-btn svg{width:28px;height:28px}
.hint{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-weight:800;color:var(--text-soft);margin:0 auto 14px;max-width:640px}
.hint b{color:var(--text);font-variant-numeric:tabular-nums}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:560px;margin:0 auto}

const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let voices = [];
let speakId = 0;
function loadVoices(){ try { voices = synth ? (synth.getVoices() || []) : []; } catch (e) { voices = []; } }
if (synth){ loadVoices(); try { synth.onvoiceschanged = loadVoices; } catch (e) {} }
function pickVoice(){
  if (!voices.length) loadVoices();
  const want = uk() ? 'en-gb' : 'en-us';
  const norm = v => (v.lang || '').replace('_', '-').toLowerCase();
  const en = voices.filter(v => norm(v).startsWith('en'));
  const exact = en.filter(v => norm(v) === want);
  const pool = exact.length ? exact : en;
  const prefer = ['Samantha','Google US English','Google UK English Female','Microsoft Aria','Microsoft Jenny','Microsoft Libby','Microsoft Sonia','Karen','Serena','Moira','Daniel','Microsoft Zira'];
  for (const p of prefer){ const v = pool.find(x => x.name.indexOf(p) > -1); if (v) return v; }
  return pool.find(v => v.localService) || pool[0] || null;
}
function speak(text){
  const id = ++speakId;
  caption(text);
  if (!synth) return wait(700 + text.length * 60).then(() => id);
  return new Promise(res => {
    let done = false;
    const fin = () => { if (!done){ done = true; res(id); } };
    try {
      synth.cancel();
      if (synth.paused) synth.resume();
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v){ u.voice = v; u.lang = v.lang; } else u.lang = uk() ? 'en-GB' : 'en-US';
      u.rate = S.settings.slow ? 0.6 : 0.85;
      u.pitch = 1.12;
      u.onend = fin; u.onerror = fin;
      synth.speak(u);
      setTimeout(fin, 1200 + text.length * (S.settings.slow ? 160 : 110));
    } catch (e) { fin(); }
  });
}
async function speakSeq(list, gap){
  for (const t of list){
    const id = await speak(t);
    if (id !== speakId) return;
    await wait(gap || 220);
    if (id !== speakId) return;
  }
}

let AC = null;
function ac(){
  if (!S.settings.sfx) return null;
  try {
    if (!AC){ const K = window.AudioContext || window.webkitAudioContext; if (!K) return null; AC = new K(); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }
  return AC;
}
function tone(f, t0, dur, o){
  const a = ac(); if (!a) return;
  o = o || {};
  const t = a.currentTime + t0, osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.vol || 0.16, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(a.destination);
  osc.start(t); osc.stop(t + dur + 0.03);
}
function noise(t0, dur, vol){
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = 900; g.gain.value = vol || 0.25;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(a.currentTime + t0);
}

function palette(){

function burst(x, y, n, spread){
  if (reduced) n = Math.min(n, 6);
  const cols = palette(); spread = spread || 1;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 7) * spread;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pickOne(cols), life: 55 + rand(50), round: Math.random() < .3 });
  }
  if (!craf) craf = requestAnimationFrame(stepC);
}
function stepC(){
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of parts){
    p.vy += .25; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life / 25));
    cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
    if (p.round){ cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 7); cx.fill(); } else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  craf = parts.length ? requestAnimationFrame(stepC) : 0;
  if (!craf) cx.clearRect(0, 0, innerWidth, innerHeight);
}

/* ================= yıldızlar ================= */
function updateStats(bump){
  $('#stat-stars').innerHTML = star() + `<b>${S.stars}</b>`;
  $('#stat-stickers').innerHTML = ICON.sticker + `<b>${totalSeen() + S.specials.length}</b>`;
  const cp = $('#chest-pill');
  cp.style.setProperty('--p', Math.min(100, Math.round(S.chest / CHEST_EVERY * 100)));
  cp.classList.toggle('ready', S.chest >= CHEST_EVERY);
  if (bump) retrigger($('#stat-stars'), 'bump');
}
function award(n, fromEl){
  S.stars += n; S.chest += n; save();
  sfx.star();
  if (reduced || !fromEl || !fromEl.isConnected){ updateStats(true); return; }
  const a = fromEl.getBoundingClientRect(), b = $('#stat-stars').getBoundingClientRect();
  const count = Math.min(n, 4);
  let landed = 0;
  for (let i = 0; i < count; i++){
    const s = document.createElement('span');
    s.className = 'fly-star'; s.innerHTML = star();
    const x0 = a.left + a.width / 2 - 15 + (i * 16 - (count - 1) * 8), y0 = a.top + a.height / 2 - 15;
    s.style.left = x0 + 'px'; s.style.top = y0 + 'px';
    document.body.appendChild(s);
    const dx = b.left + 6 - x0, dy = b.top + 5 - y0;
    if (!s.animate){ s.remove(); updateStats(true); continue; }
    const anim = s.animate([
      { transform:'translate(0,0) scale(.4)', opacity:0 },
      { transform:'translate(0,-34px) scale(1.35)', opacity:1, offset:.25 },
      { transform:`translate(${dx}px,${dy}px) scale(.7)`, opacity:1 }
    ], { duration: 820 + i * 120, easing:'cubic-bezier(.45,0,.55,1)' });
    anim.onfinish = () => { s.remove(); if (++landed === count) updateStats(true); };
  }
}

/* ================= pencereler ================= */
const modalRoot = $('#modal-root');
let afterClose = null;
function openModal(html, cls){
  modalRoot.innerHTML = `<div class="modal-back"><div class="modal ${cls || ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  modalRoot.hidden = false;
  const f = modalRoot.querySelector('.btn.primary, .chest-btn, button');
  if (f) try { f.focus({ preventScroll:true }); } catch (e) {}
}
function closeModal(){
  if (modalRoot.hidden) return;
  modalRoot.hidden = true; modalRoot.innerHTML = '';
  const f = afterClose; afterClose = null;
  if (f) f();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modalRoot.hidden) closeModal(); });

function endModal(o){
  openModal(`${owlSVG('cheer')}
    <h2>${o.title}<span lang="en">${o.en}</span></h2>
    <div class="rating">${[1, 2, 3].map(i => `<span class="${i <= o.rating ? 'on' : ''}" style="animation-delay:${.2 + i * .22}s">${star(i <= o.rating ? '' : 'off')}</span>`).join('')}</div>
    <p class="earned">+${o.earned} yıldız kazandın!</p>
    <div class="modal-actions">${o.actions}</div>`, 'end-modal');
  sfx.win(); confettiBig();
  speak(pickOne(['You did it!','Great job!','Fantastic!','Well done!','Amazing!']));
  afterClose = maybeChest;
}

let chestPrize = null;
function maybeChest(){
  if (S.chest < CHEST_EVERY || !modalRoot.hidden) return false;
  S.chest -= CHEST_EVERY;
  const avail = SPECIALS.filter(w => S.specials.indexOf(w.key) < 0);
  chestPrize = avail.length ? pickOne(avail) : null;
  if (chestPrize) S.specials.push(chestPrize.key); else S.stars += 5;
  save(); updateStats();
  openModal(`<h2>Hazine sandığı!<span lang="en">Treasure chest!</span></h2>
    <p class="sub" id="chest-sub">Açmak için sandığa dokun</p>
    <button class="chest-btn" data-act="openchest" aria-label="Sandığı aç"><span class="rays"></span>${chestSVG()}</button>
    <div class="prize" id="prize" hidden>${chestPrize
      ? `<span class="pic">${pic(chestPrize)}</span><b lang="en">${chestPrize.en}</b><small>${chestPrize.tr}</small><p>Yeni hazine çıkartması albümüne eklendi!</p>`
      : `<p>Bütün hazineleri topladın! Sana 5 yıldız hediye.</p>`}</div>
    <div class="modal-actions"><button class="btn primary" data-act="close" id="chest-ok" hidden>Süper!</button></div>`, 'chest-modal');
  sfx.unlock();
  afterClose = () => { if (current.name === 'album' || current.name === 'home') go(current.name, current.arg); maybeChest(); };
  return true;
}

(function setupGear(){
  const g = $('#gear');
  g.innerHTML = ICON.gear;
  let timer = 0, opened = false;
  g.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    opened = false; g.classList.add('holding');
    timer = setTimeout(() => { opened = true; g.classList.remove('holding'); openSettings(); }, 1100);
  });
  const stop = () => { clearTimeout(timer); g.classList.remove('holding'); };
  ['pointerup','pointerleave','pointercancel'].forEach(ev => g.addEventListener(ev, stop));
  g.addEventListener('contextmenu', e => e.preventDefault());
  g.addEventListener('click', e => {
    if (e.detail === 0){ openSettings(); return; }
    if (!opened) toast('Ebeveyn ayarları için basılı tutun');
  });
})();

const app = $('#app');
let current = { name:'home' };
let cleanup = null;
let viewActs = {};
function go(name, arg){
  if (cleanup){ try { cleanup(); } catch (e) {} cleanup = null; }
  viewActs = {};

  closeModal();
  current = { name, arg };

/* ---------- ana sayfa ---------- */
function wordOfDay(){
  const all = CATS.reduce((a, c) => a.concat(c.words), []);
  const d = new Date();
  const day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
  return all[(day * 7919) % all.length];
}
function greet(){
  const n = totalSeen();
  if (n === 0) return 'Merhaba! Ben Bubu. Bir dünya seç, resimlere dokun, İngilizcesini birlikte duyalım!';
  return pickOne([
    `Hi friend! Şimdiye kadar ${n} kelime topladın. Bugün kaç tane daha bulacağız?`,
    `Her ${CHEST_EVERY} yıldızda bir hazine sandığı açılıyor. Hadi yıldız toplayalım!`,
    'Resimlere dokun, ben de sana İngilizcesini söyleyeyim!',
    'Bir oyun seç: Bul Bakalım, Hafıza ya da Balon Patlat!'
  ]);
}
function catTile(c){
  const n = seenIn(c), pct = Math.round(n / c.words.length * 100);
  const modes = ['explore','find','memory','balloon'];
  const all = modes.every(m => best(c, m) > 0);
  return `<button class="cat-tile" data-act="cat" data-id="${c.id}" style="--cat:var(${c.color})">
    ${all ? '<span class="crown emo" aria-hidden="true">👑</span>' : ''}
    <span class="cat-icon emo" aria-hidden="true">${c.icon}</span>
    <span class="cat-name">${c.tr}</span>
    <span class="cat-en" lang="en">${catEn(c)}</span>
    <span class="cat-foot"><span class="bar" aria-label="${n} / ${c.words.length}"><i style="width:${pct}%"></i></span>
      <span class="medals">${modes.map(m => star(best(c, m) ? '' : 'off')).join('')}</span></span>
  </button>`;
}

    <div class="cats">${CATS.map(catTile).join('')}</div>

/* ---------- bölüm (keşfet) ---------- */
function labelHTML(w){
  if (!isSeen(w)) return '<b class="q">???</b>';
  const t = say(w), cls = t.length > 11 ? 'xlong' : t.length > 8 ? 'long' : '';
  return `<b lang="en" class="${cls}">${t}</b>${S.settings.showTr ? `<small>${w.tr}</small>` : ''}`;
}
const wordCard = w => `<button class="word-card${isSeen(w) ? '' : ' is-new'}" data-act="word" data-key="${w.key}" aria-label="${isSeen(w) ? say(w) : 'Yeni resim'}"><span class="pic">${pic(w)}</span><span class="label">${labelHTML(w)}</span></button>`;
function gamesHTML(c){
  const n = seenIn(c), locked = n < UNLOCK;
  return ['find','memory','balloon'].map(m => {
    const M = MODES[m], b = best(c, m);
    return `<button class="game-btn${locked ? ' locked' : ''}" data-act="game" data-mode="${m}" data-id="${c.id}"${locked ? ' aria-disabled="true"' : ''}>
      <span class="game-ico emo" aria-hidden="true">${M.ico}</span><span class="game-name">${M.tr}</span><span class="game-en" lang="en">${M.en}</span>
      ${locked ? `<span class="lock">🔒 ${n}/${UNLOCK}</span>` : `<span class="rate">${[1, 2, 3].map(i => star(i <= b ? '' : 'off')).join('')}</span>`}
    </button>`;
  }).join('');
}
function viewCat(id){
  const c = CAT[id];
  app.innerHTML = `
    <div class="page-head" style="--cat:var(${c.color})">
      <button class="back" data-act="home" aria-label="Ana sayfa">${ICON.back}</button>
      <span class="ph-icon emo" aria-hidden="true">${c.icon}</span>
      <div class="ph-title"><h1>${c.tr}</h1><span lang="en">${catEn(c)}</span></div>
      <span class="ph-count" id="cat-count">${seenIn(c)}/${c.words.length}</span>
    </div>
    <div class="games" id="games">${gamesHTML(c)}</div>
    <div class="explore-bar"><p>Resimlere dokun, İngilizcesini dinle!</p><button class="btn small" data-act="playall" id="playall">${ICON.play} Öğrendiklerimi dinle</button></div>
    <div class="words" id="words">${c.words.map(wordCard).join('')}</div>`;
  let playing = false;
  const resetPlay = () => { playing = false; const b = $('#playall'); if (b) b.innerHTML = ICON.play + ' Öğrendiklerimi dinle'; $$('.word-card.glow').forEach(x => x.classList.remove('glow')); };
  cleanup = resetPlay;
  viewActs.playall = async btn => {
    if (playing){ stopSpeech(); resetPlay(); return; }
    const list = c.words.filter(isSeen);
    if (!list.length){ nope(btn); toast('Önce resimlere dokun!'); return; }
    playing = true; btn.innerHTML = ICON.stop + ' Durdur';
    for (const w of list){
      if (!playing) break;
      const el = $(`.word-card[data-key="${CSS.escape(w.key)}"]`);
      if (!el) break;
      el.classList.add('glow');
      try { el.scrollIntoView({ block:'nearest', behavior: reduced ? 'auto' : 'smooth' }); } catch (e) {}
      retrigger(el, 'bounce');
      const id = await speak(say(w));
      el.classList.remove('glow');
      if (id !== speakId || !playing) break;
      await wait(350);
    }
    if (current.name === 'cat') resetPlay();
  };
}
function onWord(el){
  const w = WORD[el.dataset.key]; if (!w) return;
  sfx.tap(); retrigger(el, 'bounce');
  speak(say(w));
  if (isSeen(w)) return;
  S.seen[w.key] = 1; save();
  el.classList.remove('is-new');
  el.setAttribute('aria-label', say(w));
  el.querySelector('.label').innerHTML = labelHTML(w);
  retrigger(el, 'reveal');
  award(1, el); confettiAt(el, 16);
  const c = w.cat, n = seenIn(c);
  const cc = $('#cat-count'); if (cc) cc.textContent = `${n}/${c.words.length}`;
  if (n === UNLOCK){
    const g = $('#games'); g.innerHTML = gamesHTML(c); retrigger(g, 'fresh'); setTimeout(() => g.classList.remove('fresh'), 1000);
    setTimeout(() => { sfx.unlock(); toast('Oyunlar açıldı!', true); }, 500);
  } else if (n < UNLOCK){
    $('#games').innerHTML = gamesHTML(c);
  }
  if (n === c.words.length){
    setBest(c, 'explore', 3);
    setTimeout(() => {
      if (current.name !== 'cat' || current.arg !== c.id) return;
      award(3);
      endModal({ title:'Hepsini buldun!', en:'You found them all!', rating:3, earned: c.words.length + 3,
        actions:`<button class="btn" data-act="close">Kapat</button><button class="btn primary" data-act="game" data-mode="find" data-id="${c.id}">Oyna: Bul Bakalım</button>` });
    }, 1300);
  } else {
    setTimeout(() => { if (current.name === 'cat') maybeChest(); }, 1200);
  }
}

/* ---------- oyun ortak ---------- */
function phrase(c, w, kind){
  if (kind === 'pop') return c.pop || 'Pop the {w}!';
  if (uk() && c.askUK) return c.askUK;
  if (c.ask) return c.ask;
  return w.pl ? 'Where are the {w}?' : 'Where is the {w}?';
}
const askText = (c, w, kind) => phrase(c, w, kind).replace('{w}', say(w));
const askHTML = (c, w, kind) => phrase(c, w, kind).replace('{w}', `<b>${say(w)}</b>`);
function gameHead(c, mode){
  const M = MODES[mode];
  return `<div class="page-head" style="--cat:var(${c.color})">
    <button class="back" data-act="cat" data-id="${c.id}" aria-label="Geri">${ICON.back}</button>
    <span class="ph-icon emo" aria-hidden="true">${M.ico}</span>
    <div class="ph-title"><h1>${M.tr}</h1><span>${c.tr} · <span lang="en" style="display:inline">${M.en}</span></span></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>`;
}
function renderDots(done, total, now){
  const d = $('#dots'); if (!d) return;
  let h = '';
  for (let i = 0; i < total; i++) h += `<i class="${i < done ? 'on' : ''}${i === now ? ' now' : ''}"></i>`;
  d.innerHTML = h;
}
const promptHTML = `<div class="prompt"><span class="mini-owl">${owlSVG()}</span>
  <div class="prompt-bubble"><span class="ask" id="ask" lang="en"></span><button class="say-btn" data-act="reask" aria-label="Tekrar dinle">${ICON.speaker}</button></div></div>`;
function cheerOwl(){ const o = $('.mini-owl .owl'); if (o) retrigger(o, 'cheer'); }
const praise = () => pickOne(PRAISE);
const gameActions = c => `<button class="btn" data-act="again">${ICON.again} Tekrar</button><button class="btn primary" data-act="cat" data-id="${c.id}">Devam</button>`;

/* ---------- Bul Bakalım ---------- */
function viewFind(id){
  const c = CAT[id];
  const order = shuffle(c.words).slice(0, FIND_ROUNDS);
  let round = 0, mistakes = 0, streak = 0, earned = 0, first = true, busy = false, target = null;
  app.innerHTML = gameHead(c, 'find') + promptHTML + `<p class="hint"><span>Dinle, doğru resme dokun!</span></p><div class="choices" id="choices"></div>`;
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  cleanup = () => timers.forEach(clearTimeout);
  function next(){
    if (round >= order.length) return finish();
    target = order[round]; first = true; busy = false;
    const opts = shuffle([target].concat(shuffle(c.words.filter(w => w !== target)).slice(0, 3)));
    const box = $('#choices');
    box.innerHTML = opts.map(w => `<button class="choice" data-act="choose" data-key="${w.key}" aria-label="Seçenek">${pic(w)}</button>`).join('');
    retrigger(box, 'fresh');
    later(() => box.classList.remove('fresh'), 700);
    $('#ask').innerHTML = askHTML(c, target);
    renderDots(round, order.length, round);
    later(() => speak(askText(c, target)), 380);
  }
  function finish(){
    const rating = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
    setBest(c, 'find', rating);
    renderDots(order.length, order.length, -1);
    endModal({ title: rating === 3 ? 'Süpersin!' : 'Harika!', en: rating === 3 ? 'Perfect!' : 'Great job!', rating, earned, actions: gameActions(c) });
  }
  viewActs.reask = () => { if (target) speak(askText(c, target)); };
  viewActs.choose = el => {
    if (busy || el.disabled) return;
    const w = WORD[el.dataset.key];
    if (w === target){
      busy = true;
      el.classList.add('right');
      el.insertAdjacentHTML('beforeend', `<span class="ok">${ICON.check}</span><span class="tag" lang="en">${say(w)}</span>`);
      sfx.good(); confettiAt(el, 34); cheerOwl();
      if (first){
        earned++; award(1, el); streak++;
        if (streak >= 3 && streak % 3 === 0) later(() => toast(`${streak} doğru üst üste!`, true), 300);
      }
      speak(`${say(w)}! ${praise()}`);
      round++;
      renderDots(round, order.length, -1);
      later(next, 1600);
    } else {
      el.classList.add('wrong'); el.disabled = true;
      el.insertAdjacentHTML('beforeend', `<span class="tag" lang="en">${say(w)}</span>`);
      sfx.bad(); mistakes++; first = false; streak = 0;
      speakSeq([say(w), askText(c, target)], 300);
    }
  };
  next();
}

/* ---------- Hafıza ---------- */
function viewMemory(id){
  const c = CAT[id];
  const picks = shuffle(c.words).slice(0, MEMORY_PAIRS);
  const deck = shuffle(picks.concat(picks));
  let open = [], matched = 0, moves = 0, lock = false;
  app.innerHTML = gameHead(c, 'memory') + `<p class="hint"><span>Aynı iki resmi bul!</span><span><b id="moves">0</b> hamle</span></p>
    <div class="memory" id="mem" style="--cat:var(${c.color})">${deck.map((w, i) => `<button class="mcard" data-act="flip" data-i="${i}" aria-label="Kart ${i + 1}"><span class="mc-inner"><span class="mc-back"></span><span class="mc-front">${pic(w, true)}<small lang="en">${say(w)}</small></span></span></button>`).join('')}</div>`;
  renderDots(0, MEMORY_PAIRS, -1);
  const timers = [];
  cleanup = () => timers.forEach(clearTimeout);
  viewActs.flip = el => {
    if (lock || el.classList.contains('open') || el.classList.contains('done')) return;
    const w = deck[+el.dataset.i];
    el.classList.add('open'); sfx.flip(); speak(say(w));
    open.push(el);
    if (open.length < 2) return;
    moves++; $('#moves').textContent = moves;
    const [a, b] = open; open = [];
    if (deck[+a.dataset.i] === deck[+b.dataset.i]){
      lock = true;
      timers.push(setTimeout(() => {
        a.classList.add('done'); b.classList.add('done');
        sfx.good(); confettiAt(b, 22); matched++; lock = false;
        renderDots(matched, MEMORY_PAIRS, -1);
        if (matched === MEMORY_PAIRS) timers.push(setTimeout(() => {
          const rating = moves <= 9 ? 3 : moves <= 13 ? 2 : 1;
          const earned = rating + 2;
          setBest(c, 'memory', rating); award(earned, $('#mem'));
          endModal({ title:'Hepsini eşleştirdin!', en:'All matched!', rating, earned, actions: gameActions(c) });
        }, 700));
      }, 450));
    } else {
      lock = true;
      timers.push(setTimeout(() => { a.classList.remove('open'); b.classList.remove('open'); lock = false; }, 1150));
    }
  };
}

/* ---------- Balon Patlat ---------- */
function viewBalloon(id){
  const c = CAT[id];
  app.innerHTML = gameHead(c, 'balloon') + promptHTML + `<div class="sky-area" id="sky"><div class="sky-hint" id="sky-hint">Balonlar geliyor…</div></div>`;
  const sky = $('#sky');
  let Wd = sky.clientWidth, Ht = sky.clientHeight;
  const ro = window.ResizeObserver ? new ResizeObserver(() => { Wd = sky.clientWidth; Ht = sky.clientHeight; }) : null;
  if (ro) ro.observe(sky);
  let score = 0, mistakes = 0, earned = 0, target = null, running = true, busy = false;
  let list = [], lastLane = -1, sinceTarget = 0, spawnT = 0, raf = 0, last = performance.now();
  const timers = [];
  renderDots(0, BALLOON_GOAL, -1);
  const bw = () => Math.round(Math.min(100, Math.max(72, Wd / 4.3)));
  function newTarget(){
    const pool = c.words.filter(w => w !== target);
    target = pickOne(pool); sinceTarget = 0; busy = false;
    $('#ask').innerHTML = askHTML(c, target, 'pop');
    speak(askText(c, target, 'pop'));
  }
  function make(w, gold){
    const size = bw();
    const lanes = Math.max(2, Math.floor(Wd / (size * 1.08)));
    let lane; do { lane = rand(lanes); } while (lane === lastLane);
    lastLane = lane;
    const x = Math.round((Wd - size - 8) * (lane / (lanes - 1))) + 4;
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'balloon' + (gold ? ' gold' : '');
    el.style.setProperty('--b', gold ? 'var(--sun)' : (w.color || pickOne(BALLOON_COLORS)));
    el.style.width = size + 'px';
    el.style.fontSize = Math.round(size * .44) + 'px';
    el.innerHTML = `<span class="b-face">${gold ? star() : (w.color ? '' : pic(w, true))}</span>`;
    el.setAttribute('aria-label', gold ? 'Altın yıldız balonu' : say(w));
    const b = { el, w, gold, x, h: size * 1.2 + 70, y: Ht + 10, speed: (Ht + size * 2) / (8 + Math.random() * 3), phase: Math.random() * 6.3, gone: false, popping: false };
    el._b = b;
    sky.appendChild(el);
    list.push(b);
  }
  function spawn(){
    if (!running) return;
    if (list.filter(b => !b.gone).length < 6){
      const hasT = list.some(b => !b.gone && !b.popping && b.w === target);
      if (Math.random() < .07) make(null, true);
      else {
        let w;
        if (!hasT || sinceTarget >= 2 || Math.random() < .3){ w = target; sinceTarget = 0; }
        else { w = pickOne(c.words.filter(x => x !== target)); sinceTarget++; }
        make(w, false);
      }
    }
    spawnT = setTimeout(spawn, 950 + Math.random() * 650);
  }
  function tick(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (const b of list){
      if (b.gone || b.popping) continue;
      b.y -= b.speed * dt;
      b.el.style.transform = `translate(${b.x + Math.sin(now / 700 + b.phase) * 7}px,${b.y}px)`;
      if (b.y < -b.h){ b.gone = true; b.el.remove(); }
    }
    list = list.filter(b => !b.gone);
    if (running || list.length) raf = requestAnimationFrame(tick);
  }
  function popIt(b){
    b.popping = true;
    retrigger(b.el, 'popped');
    confettiAt(b.el, 20);
    timers.push(setTimeout(() => { b.gone = true; b.el.remove(); }, 230));
  }
  sky.addEventListener('pointerdown', e => {
    const el = e.target.closest('.balloon');
    if (!el || !el._b || !running) return;
    e.preventDefault();
    const b = el._b;
    if (b.gone || b.popping) return;
    if (b.gold){ popIt(b); sfx.pop(); award(2, el); speak('Bonus star!'); return; }
    if (b.w === target){
      popIt(b); sfx.pop();
      if (busy) return;
      busy = true; score++; earned++;
      sfx.good(); award(1, el); cheerOwl();
      renderDots(score, BALLOON_GOAL, -1);
      speak(`${say(b.w)}! ${praise()}`);
      if (score >= BALLOON_GOAL){
        running = false; clearTimeout(spawnT);
        timers.push(setTimeout(() => {
          const rating = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
          setBest(c, 'balloon', rating);
          endModal({ title:'Bütün balonlar patladı!', en:'Pop, pop, hooray!', rating, earned, actions: gameActions(c) });
        }, 1100));
      } else timers.push(setTimeout(newTarget, 1400));
    } else {
      retrigger(el, 'wobble'); sfx.bad(); mistakes++;
      speakSeq([say(b.w), askText(c, target, 'pop')], 300);
    }
  });
  viewActs.reask = () => { if (target) speak(askText(c, target, 'pop')); };
  timers.push(setTimeout(() => {
    const h = $('#sky-hint'); if (h) h.remove();
    Wd = sky.clientWidth; Ht = sky.clientHeight;
    newTarget(); spawn();
  }, 700));
  raf = requestAnimationFrame(t => { last = t; tick(t); });
  cleanup = () => { running = false; clearTimeout(spawnT); cancelAnimationFrame(raf); timers.forEach(clearTimeout); if (ro) ro.disconnect(); };
}

/* ---------- Albüm ---------- */
function sticker(w){
  const have = w.key.indexOf('special:') === 0 ? S.specials.indexOf(w.key) > -1 : isSeen(w);
  return `<button class="sticker${have ? '' : ' locked'}" data-act="${have ? 'hear' : 'lockedsticker'}" data-key="${w.key}" aria-label="${have ? say(w) : 'Henüz bulunmadı'}">
    <span class="pic">${pic(w, true)}</span><span class="st-label"${have ? ' lang="en"' : ''}>${have ? say(w) : '?'}</span></button>`;
}
function viewAlbum(){
  app.innerHTML = `
    <div class="page-head" style="--cat:var(--c-pink)">
      <button class="back" data-act="home" aria-label="Ana sayfa">${ICON.back}</button>
      <span class="ph-icon" aria-hidden="true">${ICON.sticker}</span>
      <div class="ph-title"><h1>Çıkartma Albümüm</h1><span lang="en">My sticker book</span></div>
      <span class="ph-count">${totalSeen() + S.specials.length}/${TOTAL + SPECIALS.length}</span>
    </div>
    <section class="album-sec treasure"><h3>Hazine çıkartmaları <small lang="en">Treasures</small><em>${S.specials.length}/${SPECIALS.length}</em></h3>
      <div class="stickers">${SPECIALS.map(sticker).join('')}</div></section>
    ${CATS.map(c => `<section class="album-sec"><h3><span class="emo" aria-hidden="true">${c.icon}</span>${c.tr} <small lang="en">${catEn(c)}</small><em>${seenIn(c)}/${c.words.length}</em></h3>
      <div class="stickers">${c.words.map(sticker).join('')}</div></section>`).join('')}`;
  $('.ph-icon').style.padding = '10px';
}

const VIEWS = { home: viewHome, cat: viewCat, find: viewFind, memory: viewMemory, balloon: viewBalloon, album: viewAlbum };

/* ================= tıklama eylemleri ================= */
const ACT = {
  home(){ go('home'); },
  cat(t){ go('cat', t.dataset.id); },
  album(){ go('album'); },
  close(){ closeModal(); },
  again(){ go(current.name, current.arg); },
  game(t){
    const c = CAT[t.dataset.id];
    if (seenIn(c) < UNLOCK){ nope(t); toast(`Önce ${UNLOCK} resme dokun!`); return; }
    go(t.dataset.mode, c.id);
  },
  word(t){ onWord(t); },
  hear(t){ const w = WORD[t.dataset.key]; sfx.tap(); retrigger(t, 'bounce'); speak(say(w)); confettiAt(t, 8); },
  lockedsticker(t){ nope(t); toast(t.dataset.key.indexOf('special:') === 0 ? 'Hazine sandıklarından çıkacak!' : 'Bunu oyunlarda bulacaksın!'); },
  wod(t){ const w = wordOfDay(); sfx.tap(); speak(say(w)); confettiAt(t, 10); },
  owl(t){ const o = t.querySelector('.owl'); retrigger(o, 'cheer'); sfx.flip(); speak(pickOne(HELLOS)); const g = $('#greet'); if (g) g.textContent = greet(); },
  starsinfo(){ toast(`${S.stars} yıldız! Hazineye ${Math.max(0, CHEST_EVERY - S.chest)} yıldız kaldı.`); },
  chestinfo(){ if (!maybeChest()) toast(`Hazine sandığına ${Math.max(0, CHEST_EVERY - S.chest)} yıldız kaldı`); },
  openchest(t){
    if (t.classList.contains('opened')) return;
    t.classList.add('opened'); sfx.chest(); confettiAt(t, 90);
    setTimeout(() => {
      const p = $('#prize'), ok = $('#chest-ok'), sub = $('#chest-sub');
      if (p) p.hidden = false; if (ok){ ok.hidden = false; ok.focus({ preventScroll:true }); } if (sub) sub.hidden = true;
      speak(chestPrize ? `Wow! ${chestPrize.en}!` : 'Wow! Five stars!');
      if (!chestPrize) updateStats(true);
    }, 420);
  },
  set(t){
    const k = t.dataset.k; let v = t.dataset.v;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    S.settings[k] = v; save(); renderSettings();
    if (k === 'sfx' && v) sfx.tap();
    if (k === 'accent') speak(v === 'uk' ? 'Hello! This is British English.' : 'Hello! This is American English.');
    if (k === 'slow') speak("Hello! Let's learn English.");
  },
  testvoice(){ speak('Hello! I am Bubu. Cat, dog, apple!'); },
  reset(){
    if (!resetArmed){
      resetArmed = true; renderSettings();
      setTimeout(() => { if (resetArmed){ resetArmed = false; if ($('.settings-modal')) renderSettings(); } }, 4000);
      return;
    }
    resetArmed = false;
    const keep = S.settings; S = fresh(); S.settings = keep; save();
    updateStats(); afterClose = null; closeModal(); go('home'); toast('İlerleme sıfırlandı');
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, fn = viewActs[a] || ACT[a];
  if (fn) fn(t, e);
});

/* ================= başlat ================= */
$('#logo-owl').innerHTML = owlSVG();
$('#chest-mini').innerHTML = chestSVG();
updateStats();
go('home');
})();
