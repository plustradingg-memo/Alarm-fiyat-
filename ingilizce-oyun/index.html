      T.demo = () => hopSeq($('#blankets'));
      if (T.pic){ setWant(`<span class="blob" style="--blob:${RED.color}"></span>`, 2); T.demo(); }
      T.talk([['tr', 'Şimdi örtüyü serelim.']].concat(prompt), prompt);
      viewActs.blanket = el => {
        if (done || !T.ready()) return;
        const w = WORD[el.dataset.key];
        if (w === RED){
          done = true; el.classList.add('chosen');
          sfx.good(); confettiAt(el, 30); cheerBubu();
          T.talk([['en', A(say(RED))], ['tr', 'Süper! Kırmızı örtüyü serdik.']]).then(() => advance(600));
          return;
        }
        sfx.hmm(); retrigger(el, 'soft');
        if (tried[w.key]){ if (!T.speaking) speakLine([['en', A(say(w))]]); return; }   // aynı yanlışa tekrar: sadece adı
        tried[w.key] = 1; miss++;
        if (miss === 1 && !T.pic){
          setWant(pic(APPLE, true), 2);
          T.talkSoon([['tr', `Bu ${w.tr}:`], ['en', say(w) + '.'], ['tr', 'Kırmızı, elma gibi!'], ['en', A(say(RED))]], prompt);
        } else { glow(redEl()); T.talkSoon([['tr', 'Kırmızı örtü burada!'], ['en', A(say(RED))]], prompt); }
      };
      T.setIdle([() => { T.talk(prompt); hopSeq($('#blankets')); }, () => glow(redEl())]);
    },
    'task-rabbit'(b){
      const hide = shuffle([RABBIT, WORD['animals:bird'], WORD['animals:frog']]);
      b.innerHTML = tellHTML() + `<div class="act-main"><div class="stage scene-bushes"><div class="bushes" id="bushes">${hide.map((w, k) => `<button class="bush" data-act="bush" data-key="${w.key}" aria-label="Çalı ${k + 1}"><span class="behind">${pic(w)}</span><span class="leaves">${bushSVG()}</span></button>`).join('')}</div></div></div>` + emptyRow;
      T.bubble(word(RABBIT));
      let found = 0, done = false;
      const prompt = [['tr', 'Tavşanı bul!'], ['en', A(say(RABBIT))]];
      const rabbitEl = () => $(`#bushes [data-key="${CSS.escape(RABBIT.key)}"]`);
      T.demo = () => {
        hopSeq($('#bushes'));
        if (T.pic){ const other = $$('#bushes .bush:not(.open)').find(x => x.dataset.key !== RABBIT.key); if (other) T.later(() => pointHand(other), 700); }
      };
      if (T.pic) setWant(pic(RABBIT, true), 1);
      T.talk([['tr', 'Tavşan saklandı! Çalılara dokun, bul bakalım.'], ['en', A(say(RABBIT))]], prompt);
      T.demo();                                                  // çalılar sırayla sallanır: dokunulabilir
      viewActs.bush = el => {
        if (done || !T.ready()) return;
        const w = WORD[el.dataset.key];
        if (el.classList.contains('open')){ if (!T.speaking) speakLine([['en', A(say(w))]]); return; }
        el.classList.add('open'); el.classList.remove('peek', 'hint-glow'); el.setAttribute('aria-label', say(w));
        if (w === RABBIT){
          done = true;
          sfx.good(); confettiAt(el, 36); cheerBubu();
          T.talk([['en', A(say(RABBIT))], ['tr', 'Buldun! Tavşan pikniğe geliyor.']]).then(() => advance(700));
          return;
        }
        // Yanlış çalı bir keşif sayılır: hayvan görünür kalır, ipucu verilir.
        sfx.pop(); found++;
        const r = rabbitEl(); if (r) r.classList.add('peek');
        if (found === 1) T.talkSoon([['tr', `Burada ${w.tr} var!`], ['en', A(say(w))], ['tr', 'Tavşanın uzun kulakları var. Kulaklara bak!']], prompt);
        else { glow(r); T.talkSoon([['tr', `Burada ${w.tr} var!`], ['en', A(say(w))], ['tr', 'Tavşan son çalıda!']], prompt); }
      };
      T.setIdle([() => { T.talk(prompt); T.demo(); }, () => { const r = rabbitEl(); if (r) r.classList.add('peek'); }]);
    },
    finale(b){
      rec.plays += 1; save();
      b.innerHTML = tellHTML() + `<div class="act-main"><div class="stage scene-finale">${ORB}<span class="fin-blanket r1" style="--b:${RED.color}" aria-hidden="true"></span>
          <span class="fin-basket r0">${basketSVG()}<span class="basket-in">${pic(APPLE, true)}</span></span>
          <span class="fin-rabbit r2">${pic(RABBIT)}</span></div></div>` + emptyRow;
      T.bubble(`<b lang="en">${A(say(APPLE))} ${A(say(RED))} ${A(say(RABBIT))}</b>`);
      sfx.win(); confettiBig(); cheerBubu();
      T.talk([['en', A(say(APPLE))], ['en', A(say(RED))], ['en', A(say(RABBIT))], ['en', `A ${say(RED)} ${say(APPLE)}!`], ['tr', 'Yaşasın! Piknik hazır!']]).then(() => advance(700));
      T.later(() => advance(0), 16000);
    },
    sticker(b){
      chosen = null;
      b.innerHTML = tellHTML() + `<div class="act-main"><div class="picks" id="picks">${STORY_STICKERS.map((w, k) => `<button class="pick${rec.stickers.indexOf(w.key) > -1 ? ' owned' : ''}" data-act="pick" data-key="${w.key}" style="--r:${[-4, 2, -2][k]}deg"><span class="pic">${pic(w)}</span><b lang="en">${say(w)}</b></button>`).join('')}</div></div><div class="go-row end-row" id="after-pick"></div>`;
      T.bubble('<span lang="tr">Bir çıkartma seç</span>');
      const names = STORY_STICKERS.map(w => ['en', A(say(w))]);
      const full = [['tr', 'Sana bir çıkartma var! Hangisini istersin?']].concat(names, [['tr', 'Birine dokun.']]);
      T.demo = () => hopSeq($('#picks'));
      (async () => {
        const tok = T.step, live = () => T.alive && tok === T.step && !chosen;
        if (T.pic) T.demo();
        if (!(await T.talk([full[0]], full)) || !live()) return;
        const els = $$('#picks .pick');
        for (let k = 0; k < els.length; k++){
          if (!live()) return;
          els[k].classList.add('spot');
          const r = await Promise.all([T.talk([names[k]], full), wait(700)]);
          els[k].classList.remove('spot');
          if (!r[0]) return;
        }
        if (live()) T.talk([['tr', 'Birine dokun.']], full);
      })();
      viewActs.pick = el => {
        if (chosen || !T.ready()) return;
        const w = WORD[el.dataset.key]; chosen = w;
        const had = rec.stickers.indexOf(w.key) > -1;
        if (!had){ rec.stickers.push(w.key); save(); updateStats(); }
        $$('#picks .pick').forEach(p => { p.classList.remove('spot'); if (p !== el) p.disabled = true; });
        el.classList.add('chosen'); sfx.good(); confettiAt(el, 50);
        $('#after-pick').innerHTML = endActions(true);
        T.setIdle([]);
        T.talk([['en', A(say(w))], ['tr', had ? 'Yine bunu seçtin! Çok güzel.' : 'Bu çıkartma artık senin!'], ['tr', 'Teşekkürler! Bubu çok mutlu. Bir daha oynayalım mı?']]);
      };
      T.setIdle([() => { T.talk([['tr', 'Bir çıkartmaya dokun.']], full); hopSeq($('#picks')); }]);
    }
  };
  render();
}

/* ---------- Minik Market ---------- */
const MARKET_ROUNDS = 4;
// Telefonda karışabilecek resimler aynı tezgâha konmaz (elma/domates/kiraz/biber, portakal/şeftali, armut/limon).
const MARKET_POOL = ['fruits:apple', 'fruits:banana', 'fruits:strawberry', 'fruits:orange', 'fruits:grapes', 'fruits:watermelon', 'fruits:pineapple', 'fruits:pear', 'fruits:lemon', 'fruits:kiwi', 'fruits:cherries', 'fruits:peach',
  'vegetables:carrot', 'vegetables:tomato', 'vegetables:corn', 'vegetables:potato', 'vegetables:broccoli', 'vegetables:mushroom', 'vegetables:cucumber', 'vegetables:eggplant', 'vegetables:onion', 'vegetables:pepper'];
const MARKET_GROUPS = [['fruits:apple', 'vegetables:tomato', 'fruits:cherries', 'vegetables:pepper'], ['fruits:orange', 'fruits:peach'], ['fruits:pear', 'fruits:lemon']];
function marketShelf(){
  const known = MARKET_POOL.filter(k => S.seen[k]);
  const story = picnicRec().plays > 0 ? ['fruits:apple', 'fruits:banana', 'vegetables:carrot'] : [];
  const order = shuffle(known).slice(0, 3).concat(shuffle(story), shuffle(MARKET_POOL));
  const groupOf = k => MARKET_GROUPS.findIndex(g => g.indexOf(k) > -1);
  const pick = [];
  for (const k of order){
    if (pick.length >= 6) break;
    if (pick.indexOf(k) > -1 || !WORD[k]) continue;
    const g = groupOf(k);
    if (g > -1 && pick.some(p => groupOf(p) === g)) continue;
    pick.push(k);
  }
  return shuffle(pick).map(k => WORD[k]);
}
function viewMarket(){
  const shelf = marketShelf();
  const orders = shuffle(shelf).slice(0, MARKET_ROUNDS);
  const T = makeTask();
  cleanup = T.end;
  T.checkPic();
  const warm = !(S.market.visits > 0) || T.pic;             // ilk ziyarette ve resimli modda ısınma gösterimi
  let round = 0, miss = 0, busy = true;
  const bought = [];
  const setBusy = v => { busy = v; const m = $('#mk'); if (m) m.dataset.turn = v ? 'bubu' : 'child'; };
  if (!S.market.bought || typeof S.market.bought !== 'object') S.market.bought = {};
  app.innerHTML = `<div class="act" id="act">${actBar('<div class="slots" id="slots"></div>')}<div class="act-body" id="mk" tabindex="-1">
    ${tellHTML()}
    <div class="act-main"><div class="market"><div class="awning" aria-hidden="true"></div>
      <div class="shelf" id="shelf">${shelf.map(w => `<span class="cell">${itemBtn(w, 'waiting')}</span>`).join('')}</div></div></div>
    <div class="basket-row">${basketBtn()}</div></div></div>`;
  try { $('#mk').focus({ preventScroll: true }); } catch (e) {}
  T.bubble('<span lang="tr">Minik Market</span>');
  const want = () => orders[round];
  const itemEl = w => $(`#shelf [data-key="${CSS.escape(w.key)}"]`);
  const please = w => ['en', `${A(say(w)).slice(0, -1)}, please!`];
  const replayLine = w => [['tr', 'Bubu şunu istiyor:'], please(w)];
  function setWant(level){
    const wp = $('#want-pic'), w = want(); if (!wp || !w) return;
    if (T.pic) level = Math.max(level, 2);                   // resimli modda istenen şey baştan resimle gösterilir
    wp.className = 'want-pic lvl' + level; wp.hidden = false;
    wp.innerHTML = level === 0 ? ICON.speaker : pic(w, true);   // 0: dinle, 1: gölge, 2: resim
    if (level) retrigger(wp, 'reveal-pic');
  }
  function slots(){
    const el = $('#slots'); if (!el) return;
    el.innerHTML = orders.map((w, k) => `<span class="slot${k < bought.length ? ' full' : ''}${k === bought.length ? ' now' : ''}">${k < bought.length ? pic(bought[k], true) : ''}</span>`).join('');
  }
  function ask(firstReq){
    const w = want(); miss = 0;
    T.checkPic();
    $('#shelf').dataset.want = w.key;
    $$('#shelf .hint-glow').forEach(x => x.classList.remove('hint-glow'));
    T.bubble(`<b lang="en">${A(say(w)).slice(0, -1)}</b>, please!`);
    slots();
    T.demo = () => demoMove($('#shelf'), $('#basket'));
    T.setIdle([
      () => { T.talk(replayLine(w)); demoMove($('#shelf'), $('#basket')); },
      () => setWant(1)
    ]);
    if (warm && firstReq){ setWant(2); warmup(w); return; }
    setWant(0); setBusy(false);
    T.talk(firstReq ? [['tr', 'Dinle, Bubu ne istiyor?'], please(w)] : [['tr', 'Bir de şunu istiyor:'], please(w)], replayLine(w));
  }
  // Isınma: el önce istenen şeye, sonra sepete dokunur (taşımadan).
  async function warmup(w){
    setBusy(true);
    const tok = T.step, live = () => T.alive && tok === T.step, el = itemEl(w), h = makeHand();
    T.later(() => handAt(h, el), 60);
    T.later(() => { handTap(h); el.classList.add('selected'); }, 900);
    await Promise.all([T.talk([['tr', 'Dinle, Bubu ne istiyor?'], please(w)], replayLine(w)), wait(1700)]);
    if (!live()) return;
    handAt(h, $('#basket'));
    T.later(() => handTap(h), 850);
    await Promise.all([T.talk([['tr', 'Önce ona dokun, sonra sepete.']], replayLine(w)), wait(1800)]);
    if (!live()) return;
    el.classList.remove('selected'); h.classList.add('fade'); T.later(() => h.remove(), 400);
    setBusy(false);
    T.talk([['tr', 'Şimdi sen yap!'], please(w)], replayLine(w));
  }
  // Her ziyarette ürünler tezgâha tek tek gelir ve adları söylenir: önce öğret, sonra iste.
  async function parade(){
    const tok = T.step, live = () => T.alive && tok === T.step;
    await Promise.all([T.talk([['tr', 'Minik Market’e hoş geldin!']]), wait(900)]);
    const els = $$('#shelf .item');
    for (let k = 0; k < els.length; k++){
      if (!live()) return;
      els[k].classList.remove('waiting'); retrigger(els[k], 'arrive');
      await Promise.all([T.talk([['en', A(say(shelf[k]))]]), wait(800)]);
    }
    if (!live()) return;
    await Promise.all([T.talk([['tr', 'Bubu ne isterse, sepete koy.']]), wait(600)]);
    if (live()) ask(true);
  }
  function finish(){
    S.market.visits = (S.market.visits || 0) + 1; save();
    T.clearStep(); slots();
    $('#mk').innerHTML = tellHTML() + `<div class="act-main"><div class="full-basket"><div class="fb-items" id="fb-items">${bought.map(w => `<button class="r-item" data-act="rhear" data-key="${w.key}"><span class="pic">${pic(w)}</span><b lang="en">${say(w)}</b>${S.settings.showTr ? `<small>${w.tr}</small>` : ''}</button>`).join('')}</div><div class="fb-basket">${basketSVG()}</div></div></div><div class="go-row end-row">${endActions(false)}</div>`;
    T.bubble('<b lang="en">Thank you!</b>');
    sfx.win(); confettiBig(); cheerBubu();
    (async () => {
      const tok = T.step, live = () => T.alive && tok === T.step;
      await Promise.all([T.talk([['tr', 'Sepet doldu!']]), wait(700)]);
      const els = $$('#fb-items .r-item');
      for (let k = 0; k < els.length; k++){
        if (!live()) return;
        retrigger(els[k], 'bounce');
        await Promise.all([T.talk([['en', A(say(bought[k]))]]), wait(650)]);
      }
      if (!live()) return;
      await T.talk([['en', 'Thank you! Bye-bye!']]);
      if (live()) T.talk([['tr', 'Bir daha oynayalım mı?']]);
    })();
  }
  viewActs.rhear = el => { const w = WORD[el.dataset.key]; sfx.tap(); retrigger(el, 'bounce'); speakLine([['en', A(say(w))]]); };
  T.placer = makePlacer($('#mk'), {
    target: $('#basket'),
    locked: () => busy || !T.ready(),
    onSelect: el => {
      sfx.tap(); if (!T.speaking) speakLine([['en', A(say(WORD[el.dataset.key]))]]);
      const bk = $('#basket'); if (bk && bk.getBoundingClientRect().bottom > innerHeight) bk.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
    },
    onSelectIdle: el => { retrigger($('#basket'), 'hop'); if (T.pic) demoMove(el, $('#basket')); else T.talk([['tr', 'Şimdi sepete dokun.']], replayLine(want())); },
    onEmptyTarget: () => { hopSeq($('#shelf')); T.talk([['tr', 'Önce birine dokun, sonra sepete.'], please(want())], replayLine(want())); },
    onPlace: (el, from) => {
      const w = WORD[el.dataset.key], target = want();
      if (w === target){
        setBusy(true); bought.push(w);
        S.market.bought[w.key] = (S.market.bought[w.key] || 0) + 1; save();
        el.classList.add('gone'); el.disabled = true; el.removeAttribute('data-item');
        if (el.parentNode) el.parentNode.classList.add('empty');          // boş raf yeri kalır, diğerleri kaymaz
        T.fly(from, $('#basket'), w);
        sfx.good(); confettiAt($('#basket'), 24); cheerBubu();
        round++; slots();
        const last = round >= orders.length;
        T.talk([['en', `${A(say(w)).slice(0, -1)}! Thank you!`]]).then(() => T.later(last ? finish : () => ask(false), 400));
        return true;
      }
      miss++; sfx.hmm(); retrigger(el, 'soft');
      if (miss === 1 && !T.pic){ setWant(1); T.talkSoon([['tr', `Bu ${w.tr}:`], ['en', say(w) + '.'], ['tr', 'Bubu başka bir şey istiyor. Dinle:'], please(target)], replayLine(target)); }
      else if (miss <= 2){ setWant(2); glow(itemEl(target)); T.talkSoon([['tr', `Bubu ${target.tr} istiyor. Bak, burada!`], ['en', A(say(target))]], replayLine(target)); }
      else { setWant(2); const t = itemEl(target); glow(t); T.placer.preselect(t); pointHand($('#basket')); T.talkSoon([['tr', 'Şimdi sepete dokun.']], replayLine(target)); }
      return false;
    }
  });
  slots();
  parade();
}

/* ---------- etkinlikten çıkış: ana sayfa düğmesi, Escape ve telefonun "geri" hareketi ---------- */
const ACT_VIEWS = ['story', 'market'];
const inAct = () => ACT_VIEWS.indexOf(current.name) > -1;
let pendingRoute = null;
function actHistoryState(){ try { return !!(history.state && history.state.bubuAct); } catch (e) { return false; } }
function leaveTo(name){
  if (!actHistoryState()){ go(name); return; }
  pendingRoute = name;
  try { history.back(); } catch (e) { pendingRoute = null; go(name); return; }
  setTimeout(() => { if (pendingRoute){ const r = pendingRoute; pendingRoute = null; go(r); } }, 450);
}
window.addEventListener('popstate', () => {
  if (pendingRoute){ const r = pendingRoute; pendingRoute = null; go(r); return; }
  if (inAct()) go('home');
});
document.addEventListener('visibilitychange', () => {
  if (!inAct()) return;
  const T = curTask;
  if (document.hidden){                                  // kilitli ekranda Bubu konuşmasın, sürükleme yarıda kalmasın
    stopSpeech();
    if (T){ if (T.placer) T.placer.cancelDrag(); clearTimeout(T.idleT); }
  } else {
    const r = $('.act-btn.replay'); if (r) retrigger(r, 'hop');
    if (T) T.armIdle();
  }
});

const VIEWS = { home: viewHome, cat: viewCat, find: viewFind, memory: viewMemory, balloon: viewBalloon, album: viewAlbum, story: viewStory, market: viewMarket };

/* ================= tıklama eylemleri ================= */
const ACT = {
  home(){ go('home'); },
  exit(){ sfx.tap(); leaveTo('home'); },
  story(){ go('story'); },
  market(){ go('market'); },
  cat(t){ go('cat', t.dataset.id); },
  album(){ if (inAct()) leaveTo('album'); else go('album'); },
  close(){ closeModal(); },
  again(){ go(current.name, current.arg); },
  game(t){
    const c = CAT[t.dataset.id];
    if (seenIn(c) < UNLOCK){ nope(t); toast(`Önce ${UNLOCK} resme dokun!`); return; }
    go(t.dataset.mode, c.id);
  },
  word(t){ onWord(t); },
  hear(t){ const w = WORD[t.dataset.key]; sfx.tap(); retrigger(t, 'bounce'); speak(say(w)); confettiAt(t, 8); },
  lockedsticker(t){
    nope(t);
    const k = t.dataset.key;
    if (k.indexOf('story:') === 0){ toast('Bubu’nun Pikniği’nin sonunda seçebilirsin!'); speakLine([['tr', 'Bunu Bubu’nun Pikniği hikâyesinin sonunda seçebilirsin.']]); return; }
    toast(k.indexOf('special:') === 0 ? 'Hazine sandıklarından çıkacak!' : 'Bunu oyunlarda bulacaksın!');
  },
  wod(t){ const w = wordOfDay(); sfx.tap(); speak(say(w)); confettiAt(t, 10); },
  owl(t){ const o = t.querySelector('.owl'); retrigger(o, 'cheer'); sfx.flip(); speak(pickOne(HELLOS)); const g = $('#greet'); if (g) g.textContent = greet(); },
  starsinfo(){ toast(`${S.stars} yıldız! Hazineye ${Math.max(0, CHEST_EVERY - S.chest)} yıldız kaldı.`); },
  chestinfo(){ if (!maybeChest()) toast(`Hazine sandığına ${Math.max(0, CHEST_EVERY - S.chest)} yıldız kaldı`); },
  openchest(t){
    if (t.classList.contains('opened')) return;
    t.classList.add('opened'); sfx.chest(); confettiAt(t, 90);
    setTimeout(() => {
      const p = $('#prize'), ok = $('#chest-ok'), sub = $('#chest-sub');
      if (p) p.hidden = false; if (ok){ ok.hidden = false; ok.focus({ preventScroll:true }); } if (sub) sub.hidden = true;
      speak(chestPrize ? `Wow! ${chestPrize.en}!` : 'Wow! Five stars!');
      if (!chestPrize) updateStats(true);
    }, 420);
  },
  set(t){
    const k = t.dataset.k; let v = t.dataset.v;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    S.settings[k] = v; save(); renderSettings();
    if (k === 'sfx' && v) sfx.tap();
    if (k === 'accent') speak(v === 'uk' ? 'Hello! This is British English.' : 'Hello! This is American English.');
    if (k === 'slow') speak("Hello! Let's learn English.");
    if (k === 'trVoice' && v) speakLine([['tr','Türkçe yönlendirme açık.']]);
  },
  testvoice(){ speakLine([['en', 'Hello! I am Bubu. Cat, dog, apple!']]); },
  testtr(){ speakLine(canSpeakTr() ? [['tr', 'Merhaba! Ben Bubu. Hadi oynayalım!'], ['en', 'Hello!']] : [['en', 'Hello!']]); if (!canSpeakTr()) toast('Türkçe ses bulunamadı'); },
  reset(){
    if (!resetArmed){
      resetArmed = true; renderSettings();
      setTimeout(() => { if (resetArmed){ resetArmed = false; if ($('.settings-modal')) renderSettings(); } }, 4000);
      return;
    }
    resetArmed = false;
    const keep = S.settings; S = fresh(); S.settings = keep; save();
    updateStats(); afterClose = null; closeModal(); go('home'); toast('İlerleme sıfırlandı');
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, fn = viewActs[a] || ACT[a];
  if (fn) fn(t, e);
});

/* ================= başlat ================= */
$('#logo-owl').innerHTML = owlSVG();
$('#chest-mini').innerHTML = chestSVG();
updateStats();
go('home');
})();
