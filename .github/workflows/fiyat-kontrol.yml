name: Fiyat kontrolü

on:
  schedule:
    - cron: '*/30 * * * *'   # her 30 dakikada bir (GitHub yoğunlukta birkaç dakika geciktirebilir)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma
  push:
    paths:
      - products.json         # yeni ürün eklenince hemen kontrol et

permissions:
  contents: write
  issues: write

concurrency:
  group: fiyat-kontrol
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fiyatları kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BILDIRIMI: ${{ vars.ISSUE_BILDIRIMI || 'true' }}
        run: node scripts/check-prices.mjs

      # Bot korumasına takılan sayfaları gerçek tarayıcıyla yeniden dene
      - name: Engellenenleri tarayıcıyla dene
        if: hashFiles('.basarisiz.json') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BILDIRIMI: ${{ vars.ISSUE_BILDIRIMI || 'true' }}
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/check-prices.mjs --tarayici

      - name: Sonuçları kaydet
        run: |
          git config user.name "fiyat-alarmi[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
            exit 0
          fi
          git commit -m "Fiyatlar güncellendi [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
